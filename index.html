<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
<title>穿越火线 · 生化模式（人机打僵尸）</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; overflow:hidden; background:#000; font-family:"Microsoft YaHei",sans-serif; user-select:none; }
  canvas { display:block; }
  #hudTopRight, #hudBottomRight, #crosshair, #hitmarker, #damageFlash, #prompt, #mapBox, #killFeed { position:absolute; z-index:10; color:#fff; text-shadow:0 1px 3px #000; }
  #hudTopRight { top:12px; right:12px; background:rgba(0,0,0,.45); padding:8px 14px; border-radius:10px; font-size:16px; }
  #hudBottomRight { bottom:12px; right:12px; background:rgba(0,0,0,.45); padding:8px 14px; border-radius:10px; font-size:16px; text-align:right; }
  #hudBottomRight div { margin:2px 0; }
  #mapBox { left:12px; bottom:12px; background:rgba(0,0,0,.5); padding:6px; border-radius:10px; }
  #map { display:block; width:180px; height:144px; border-radius:6px; }
  #crosshair { left:50%; top:50%; width:22px; height:22px; margin:-11px 0 0 -11px; pointer-events:none; transition:transform .08s; }
  #crosshair::before, #crosshair::after { content:""; position:absolute; background:#fff; box-shadow:0 0 3px #000; }
  #crosshair::before { left:10px; top:0; width:2px; height:22px; }
  #crosshair::after { left:0; top:10px; width:22px; height:2px; }
  #hitmarker { left:50%; top:50%; width:26px; height:26px; margin:-13px 0 0 -13px; pointer-events:none; display:none; }
  #hitmarker::before, #hitmarker::after { content:""; position:absolute; background:#f00; box-shadow:0 0 3px #000; }
  #hitmarker::before { left:12px; top:0; width:2px; height:26px; transform:rotate(45deg); }
  #hitmarker::after { left:12px; top:0; width:2px; height:26px; transform:rotate(-45deg); }
  #damageFlash { inset:0; background:red; opacity:0; pointer-events:none; transition:opacity .2s; z-index:9; }
  #prompt { left:50%; top:60%; transform:translateX(-50%); font-size:17px; color:#f1c40f; display:none; pointer-events:none; }
  #killFeed { top:60px; left:50%; transform:translateX(-50%); text-align:center; font-size:15px; }
  #killFeed div { margin:2px 0; background:rgba(0,0,0,.35); padding:2px 8px; border-radius:4px; display:inline-block; }
  #overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,.7); backdrop-filter:blur(3px); z-index:20; }
  .screen { display:none; flex-direction:column; align-items:center; background:rgba(20,20,20,.92); padding:30px 45px; border-radius:16px; text-align:center; color:#fff; max-width:480px; }
  .screen h1 { margin:0 0 10px; font-size:28px; color:#f1c40f; }
  .screen h2 { margin:0 0 10px; font-size:26px; }
  .screen p { margin:6px 0; font-size:14px; color:#ddd; line-height:1.7; }
  button { cursor:pointer; border:none; border-radius:8px; padding:12px 24px; font-size:16px; background:#e74c3c; color:#fff; margin-top:14px; font-weight:bold; }
  button:hover { background:#c0392b; }
  .status { color:#f1c40f; margin-top:10px; font-size:14px; }
  #touchUI { position:absolute; inset:0; pointer-events:none; z-index:15; display:none; }
  #joyBase { position:absolute; left:20px; bottom:20px; width:120px; height:120px; border-radius:50%; background:rgba(255,255,255,.18); border:2px solid rgba(255,255,255,.35); pointer-events:auto; touch-action:none; }
  #joyStick { position:absolute; left:50%; top:50%; width:50px; height:50px; margin:-25px 0 0 -25px; border-radius:50%; background:rgba(255,255,255,.55); }
  .tBtn { position:absolute; right:20px; bottom:20px; width:84px; height:84px; border-radius:50%; font-size:15px; color:#fff; pointer-events:auto; touch-action:none; border:none; }
  #btnFire { background:rgba(231,76,60,.9); }
  #btnReload { right:116px; width:70px; height:70px; background:rgba(52,152,219,.9); font-size:13px; }
</style>
</head>
<body>
<div id="hudTopRight">❤ 血量：<span id="hp">100</span></div>
<div id="hudBottomRight">
  <div>🔫 弹药：<span id="ammo">30 / ∞</span></div>
  <div>🌊 波次：<span id="wave">1</span></div>
  <div>💀 击杀：<span id="kills">0</span></div>
</div>
<div id="mapBox"><canvas id="map" width="180" height="144"></canvas></div>
<div id="crosshair"></div>
<div id="hitmarker"></div>
<div id="damageFlash"></div>
<div id="prompt"></div>
<div id="killFeed"></div>

<div id="touchUI">
  <div id="joyBase"><div id="joyStick"></div></div>
  <button class="tBtn" id="btnReload">换弹</button>
  <button class="tBtn" id="btnFire">射击</button>
</div>

<div id="overlay">
  <div id="menu" class="screen">
    <h1>🧟 穿越火线 · 生化模式</h1>
    <p><b>任务：</b>你是佣兵，消灭一波波来袭的生化僵尸，生存下去！</p>
    <p><b>操作：</b>WASD 移动 · 鼠标看向 · <b>左键</b>射击 · <b>R</b> 换弹(∞) · <b>Shift</b> 疾走</p>
    <p><b>提示：</b>瞄准僵尸头部可造成致命爆头伤害（75），身体仅 25！</p>
    <button onclick="startGame()">开始游戏</button>
    <div id="loadStatus" class="status">正在加载僵尸模型(Soldier.glb)…</div>
  </div>
  <div id="gameOverScreen" class="screen">
    <h2>☠ 你被僵尸感染了</h2>
    <p id="goStats"></p>
    <button onclick="location.reload()">重新开始</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/environments/RoomEnvironment.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js"></script>
<script>
/* ============ 工具 & 音频 ============ */
const $ = id => document.getElementById(id);
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
let actx=null, noiseBuf=null;
function initAudio(){ if(actx){ if(actx.state==='suspended') actx.resume(); return; } actx=new (window.AudioContext||window.webkitAudioContext)();
  const len=actx.sampleRate*0.2; noiseBuf=actx.createBuffer(1,len,actx.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<len;i++) d[i]=Math.random()*2-1; }
function playBuf(buf,vol,dur,rate=1){ if(!actx||!buf) return; const s=actx.createBufferSource(); s.buffer=buf; s.playbackRate.value=rate;
  const g=actx.createGain(); g.gain.setValueAtTime(vol,actx.currentTime); g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+dur); s.connect(g); g.connect(actx.destination); s.start(); }
function beep(f,d,type='sine',vol=.15){ if(!actx) return; const o=actx.createOscillator(), g=actx.createGain(); o.type=type; o.frequency.value=f; o.connect(g); g.connect(actx.destination);
  g.gain.setValueAtTime(vol,actx.currentTime); g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d); o.start(); o.stop(actx.currentTime+d); }
const sShoot=()=>playBuf(noiseBuf,.18,.12,1.2);
const sHit=()=>beep(1400,.05,'square',.12);
const sHead=()=>{beep(2000,.06,'square',.15); setTimeout(()=>beep(2600,.06,'square',.12),60);};
const sZombieDeath=()=>{beep(200,.3,'sawtooth',.12); setTimeout(()=>beep(100,.4,'sawtooth',.1),150);};
const sHurt=()=>beep(180,.25,'sawtooth',.12);
const sReload=()=>{beep(500,.06,'square',.08); setTimeout(()=>beep(700,.08,'square',.08),180);};

/* ============ 渲染器 & 场景（CF运输船夜晚工业风） ============ */
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x0a0f1a);
scene.fog=new THREE.Fog(0x0a0f1a,20,70);
const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.05,200);
camera.rotation.order='YXZ';
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.1;
document.body.insertBefore(renderer.domElement,document.body.firstChild);
try{ const pmrem=new THREE.PMREMGenerator(renderer); scene.environment=pmrem.fromScene(new THREE.RoomEnvironment(),0.04).texture; }catch(e){}

// 灯光：幽暗环境 + 红色/蓝色团队灯 + 主平行光
scene.add(new THREE.HemisphereLight(0x555566, 0x111111, 0.5));
const dirLight=new THREE.DirectionalLight(0xaaccff,.7); dirLight.position.set(20,30,20); dirLight.castShadow=true;
dirLight.shadow.mapSize.width=dirLight.shadow.mapSize.height=2048;
const sc=dirLight.shadow.camera; sc.left=-25;sc.right=25;sc.top=25;sc.bottom=-25;sc.near=.5;sc.far=80; scene.add(dirLight);
const redLight=new THREE.PointLight(0xff3333,.6,40); redLight.position.set(-15,6,-20); scene.add(redLight);
const blueLight=new THREE.PointLight(0x3366ff,.6,40); blueLight.position.set(15,6,20); scene.add(blueLight);

function canvasTex(draw,rx,ry){ const c=document.createElement('canvas'); c.width=c.height=128; draw(c.getContext('2d'));
  const t=new THREE.CanvasTexture(c); t.encoding=THREE.sRGBEncoding; if(rx){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);} return t; }
// 金属甲板纹理
const metalTex=canvasTex(x=>{ x.fillStyle='#2c3e50'; x.fillRect(0,0,128,128);
  x.strokeStyle='#34495e'; x.lineWidth=2;
  for(let i=0;i<=128;i+=16){ x.beginPath(); x.moveTo(i,0); x.lineTo(i,128); x.stroke(); x.beginPath(); x.moveTo(0,i); x.lineTo(128,i); x.stroke(); }
},12,18);
// 集装箱/墙壁纹理
const wallTex=canvasTex(x=>{ x.fillStyle='#555'; x.fillRect(0,0,128,128);
  x.fillStyle='#444'; for(let i=0;i<8;i++) x.fillRect(0,i*16,128,8); });
wallTex.wrapS=wallTex.wrapT=THREE.RepeatWrapping; wallTex.repeat.set(4,2);
// 弹孔 & 烟雾
const holeTex=canvasTex(x=>{ x.clearRect(0,0,128,128); const g=x.createRadialGradient(64,64,0,64,64,64);
  g.addColorStop(0,'rgba(10,10,10,0.95)'); g.addColorStop(0.6,'rgba(30,30,30,0.8)'); g.addColorStop(1,'rgba(50,50,50,0)');
  x.fillStyle=g; x.beginPath(); x.arc(64,64,50,0,Math.PI*2); x.fill(); x.fillStyle='rgba(0,0,0,0.9)'; x.beginPath(); x.arc(64,64,18,0,Math.PI*2); x.fill();
  for(let i=0;i<16;i++){ const a=Math.random()*Math.PI*2, r=20+Math.random()*40; x.fillStyle='rgba(0,0,0,0.55)'; x.beginPath(); x.arc(64+Math.cos(a)*r,64+Math.sin(a)*r,4+Math.random()*5,0,Math.PI*2); x.fill(); } });
const smokeTex=canvasTex(x=>{ const g=x.createRadialGradient(64,64,0,64,64,64); g.addColorStop(0,'rgba(220,220,220,0.7)'); g.addColorStop(1,'rgba(220,220,220,0)'); x.fillStyle=g; x.fillRect(0,0,128,128); });

/* ============ CF运输船地图生成 ============ */
const obstacles=[];
const floor=new THREE.Mesh(new THREE.PlaneGeometry(40,60), new THREE.MeshStandardMaterial({map:metalTex,roughness:.8,metalness:.5}));
floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; scene.add(floor);

function addWall(cx,cz,w,d,h=8){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d), new THREE.MeshStandardMaterial({map:wallTex,roughness:.9}));
  m.position.set(cx,h/2,cz); m.receiveShadow=true; m.castShadow=true; scene.add(m);
  obstacles.push(new THREE.Box3().setFromObject(m));
}
// 边界墙 (40x60 地图: X -20~20, Z -30~30)
addWall(0,-30,40,1); addWall(0,30,40,1); addWall(-20,0,1,60); addWall(20,0,1,60);
// 集装箱/掩体
function createContainer(x,z,w,d,h,color,rotY=0){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d), new THREE.MeshStandardMaterial({color:color,roughness:.6,metalness:.3}));
  m.position.set(x,h/2,z); m.rotation.y=rotY; m.castShadow=true; m.receiveShadow=true; scene.add(m);
  obstacles.push(new THREE.Box3().setFromObject(m));
}
function createStack(x,z,w,d,h,color,levels){
  for(let i=0;i<levels;i++) createContainer(x, z, w, d, h, color).position.y = h/2 + i*h;
}
// 对称运输船布局
createContainer(-14, 12, 4, 10, 3, 0xc0392b);
createContainer(-14, 0,  4, 10, 3, 0x2980b9);
createContainer(-14,-12, 4, 10, 3, 0x27ae60);
createContainer( 14, 12, 4, 10, 3, 0xc0392b);
createContainer( 14, 0,  4, 10, 3, 0x2980b9);
createContainer( 14,-12, 4, 10, 3, 0x27ae60);
createContainer(-7, 8,  4,  6, 3, 0xf39c12);
createContainer(-7,-8,  4,  6, 3, 0x8e44ad);
createContainer( 7, 8,  4,  6, 3, 0xf39c12);
createContainer( 7,-8,  4,  6, 3, 0x8e44ad);
createContainer(0, 0, 6, 24, 3, 0x7f8c8d); // 中央长集装箱
// 角落狙击台（堆叠）
createStack(-17, 22, 4, 4, 3, 0xd35400, 2);
createStack( 17, 22, 4, 4, 3, 0xd35400, 2);
createStack(-17,-22, 4, 4, 3, 0xd35400, 2);
createStack( 17,-22, 4, 4, 3, 0xd35400, 2);

/* ============ 第一人称枪械 ============ */
function createWeaponModel(){
  const g=new THREE.Group();
  const matDark=new THREE.MeshStandardMaterial({color:0x222222,metalness:.8,roughness:.4});
  const matBody=new THREE.MeshStandardMaterial({color:0x333333,metalness:.6,roughness:.5});
  const matAcc=new THREE.MeshStandardMaterial({color:0x555555,metalness:.7,roughness:.3});
  const body=new THREE.Mesh(new THREE.BoxGeometry(.12,.14,.6),matBody); g.add(body);
  const barrel=new THREE.Mesh(new THREE.CylinderGeometry(.02,.02,.5,12),matDark); barrel.rotation.x=Math.PI/2; barrel.position.set(0,.02,-.5); g.add(barrel);
  const mag=new THREE.Mesh(new THREE.BoxGeometry(.08,.18,.1),matAcc); mag.position.set(0,-.14,.1); g.add(mag);
  const stock=new THREE.Mesh(new THREE.BoxGeometry(.1,.12,.3),matBody); stock.position.set(0,-.02,.4); g.add(stock);
  const sight=new THREE.Mesh(new THREE.BoxGeometry(.02,.04,.02),matDark); sight.position.set(0,.09,-.2); g.add(sight);
  const muzzleObj=new THREE.Object3D(); muzzleObj.position.set(0,.02,-.78); g.add(muzzleObj);
  const flash=new THREE.Sprite(new THREE.SpriteMaterial({color:0xffdd66,transparent:true,opacity:0}));
  flash.scale.set(.35,.35,.35); flash.position.copy(muzzleObj.position); flash.visible=false; g.add(flash);
  const light=new THREE.PointLight(0xffaa33,0,3); light.position.copy(muzzleObj.position); g.add(light);
  g.traverse(o=>{ if(o.isMesh||o.isSprite) o.raycast=function(){}; });
  return {group:g, muzzleObj, flash, light};
}
const baseGunPos=new THREE.Vector3(0.25,-0.22,-0.55);
const fpWeapon=createWeaponModel(); fpWeapon.group.position.copy(baseGunPos); camera.add(fpWeapon.group); scene.add(camera);

/* ============ 玩家状态 ============ */
let health=100, mag=30, maxMag=30;
let wave=1, kills=0, aliveCount=0, zombiesToSpawn=0, spawnTimer=0, waveClearing=false;
let playing=false, isDead=false, gunRecoil=0, crossExpand=0, isMoving=false;
let usingTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
if(usingTouch) $('touchUI').style.display='block';
const zombies=[];
const raycaster=new THREE.Raycaster();
const sparkGeo=new THREE.SphereGeometry(.045,8,8);
const tracers=[], smokes=[], bloods=[], decals=[];
function spawnSpark(p,c){ const m=new THREE.Mesh(sparkGeo,new THREE.MeshBasicMaterial({color:c})); m.position.copy(p); scene.add(m); setTimeout(()=>{scene.remove(m);m.geometry.dispose();m.material.dispose();},260); }
function showHitMarker(){ const h=$('hitmarker'); h.style.display='block'; setTimeout(()=>h.style.display='none',110); }
function flashDamage(){ const d=$('damageFlash'); d.style.opacity='.3'; setTimeout(()=>d.style.opacity='0',110); }
function updateHUD(){ $('hp').textContent=Math.max(0,health|0); $('ammo').textContent=mag+' / ∞'; $('wave').textContent=wave; $('kills').textContent=kills; }
function createTracer(from,to){ const dir=new THREE.Vector3().subVectors(to,from); const len=dir.length(); if(len<0.01) return;
  const geo=new THREE.CylinderGeometry(0.012,0.012,len,6,1,true); geo.translate(0,-len/2,0);
  const mat=new THREE.MeshBasicMaterial({color:0xffff88,transparent:true,opacity:.9,blending:THREE.AdditiveBlending,depthWrite:false});
  const mesh=new THREE.Mesh(geo,mat); mesh.position.copy(from); mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.clone().normalize()); scene.add(mesh); tracers.push({mesh,life:0.12}); }
function createBulletHole(h){ if(!h.face) return; const nMat=new THREE.Matrix3().getNormalMatrix(h.object.matrixWorld); const wN=h.face.normal.clone().applyMatrix3(nMat).normalize();
  const mat=new THREE.MeshBasicMaterial({map:holeTex,transparent:true,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-4});
  const decal=new THREE.Mesh(new THREE.PlaneGeometry(0.12,0.12),mat); decal.position.copy(h.point).addScaledVector(wN,0.003); decal.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1), wN); scene.add(decal); decals.push(decal);
  if(decals.length>60){ const o=decals.shift(); scene.remove(o); o.geometry.dispose(); o.material.dispose(); } }
function createSmoke(pos,sb=0.1){ const spr=new THREE.Sprite(new THREE.SpriteMaterial({map:smokeTex,transparent:true,opacity:.5,depthWrite:false})); spr.position.copy(pos); spr.scale.setScalar(sb); scene.add(spr); smokes.push({spr,life:.45,max:.45,sb}); }
function createBlood(pos){ for(let i=0;i<7;i++){ const m=new THREE.Mesh(new THREE.SphereGeometry(0.018+Math.random()*0.022,6,6), new THREE.MeshBasicMaterial({color:0x8a0303})); m.position.copy(pos);
  const v=new THREE.Vector3((Math.random()-0.5)*0.06, Math.random()*0.05, (Math.random()-0.5)*0.06); scene.add(m); bloods.push({m,v,life:.35}); } }
function addKillFeed(k,v){ const kf=$('killFeed'); const d=document.createElement('div'); d.style.color='#2ecc71'; d.innerHTML=`${k} ⚔ ${v}`; kf.appendChild(d); setTimeout(()=>{ if(d.parentNode) d.parentNode.removeChild(d); },2500); }
function playerTakeDamage(amt){
  if(isDead) return;
  health-=amt; flashDamage(); sHurt(); updateHUD();
  if(health<=0){ health=0; isDead=true; $('goStats').textContent=`坚持到第 ${wave} 波，击杀 ${kills} 只僵尸`; $('gameOverScreen').style.display='flex'; $('overlay').style.display='flex'; document.exitPointerLock(); }
}

/* ============ 加载僵尸模型（Soldier.glb，绿色化为僵尸） ============ */
let soldierGltf=null, modelReady=false;
new THREE.GLTFLoader().load(
  'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/models/gltf/Soldier.glb',
  gltf=>{ soldierGltf=gltf; gltf.scene.traverse(o=>{ if(o.isMesh){o.castShadow=true;o.receiveShadow=true;} }); modelReady=true; $('loadStatus').textContent='✅ 模型已加载，点击开始游戏！'; },
  undefined, ()=>{ $('loadStatus').textContent='❌ 模型加载失败，将使用备用方块僵尸（请检查网络）'; }
);

function spawnZombie(){
  let clone, mixer=null, idle=null, walk=null;
  if(soldierGltf){
    clone=THREE.SkeletonUtils.clone(soldierGltf.scene);
    clone.traverse(o=>{ if(o.isMesh&&o.material){ o.material=o.material.clone(); o.material.color.setHex(0x4a5d23); o.castShadow=true; o.receiveShadow=true; } });
    mixer=new THREE.AnimationMixer(clone); const clips=soldierGltf.animations;
    idle=mixer.clipAction(THREE.AnimationClip.findByName(clips,'Idle')); walk=mixer.clipAction(THREE.AnimationClip.findByName(clips,'Walk'));
  } else {
    clone=new THREE.Group();
    const body=new THREE.Mesh(new THREE.CylinderGeometry(.3,.3,1.2,8), new THREE.MeshStandardMaterial({color:0x4a5d23})); body.position.y=.6; body.castShadow=true;
    const head=new THREE.Mesh(new THREE.SphereGeometry(.25,8,8), new THREE.MeshStandardMaterial({color:0x2e8b57})); head.position.y=1.4; head.castShadow=true;
    clone.add(body); clone.add(head);
  }
  clone.scale.setScalar(1.1);
  const x=(Math.random()-0.5)*28; const z=-26-Math.random()*4; // 从远端（-Z）刷新
  clone.position.set(x,0,z);
  clone.userData={ isZombie:true, hp:80+wave*20, speed:1.1+wave*0.12, lastAttack:0, dead:false, dying:false, deathTimer:0, mixer };
  if(mixer){ idle.play(); walk.play(); idle.setEffectiveWeight(0); walk.setEffectiveWeight(1); clone.userData.actions={idle,walk}; }
  scene.add(clone); zombies.push(clone); aliveCount++;
}
function killZombie(z){
  if(z.userData.dead) return;
  z.userData.dead=true; z.userData.dying=true; z.userData.deathTimer=.5;
  sZombieDeath(); kills++; aliveCount--; updateHUD(); addKillFeed('你','僵尸');
}
function startWave(){
  zombiesToSpawn = 4 + wave*2;
  spawnTimer = 1; waveClearing=false; updateHUD();
}

/* ============ 流程 ============ */
function startGame(){
  initAudio();
  $('menu').style.display='none'; $('overlay').style.display='none';
  camera.position.set(0,1.6,25); camera.rotation.set(0,0,0); // 玩家在近端(Z=25)，看向-Z（僵尸方向）
  health=100; mag=maxMag; wave=1; kills=0; isDead=false; playing=true;
  zombies.forEach(z=>scene.remove(z)); zombies.length=0; aliveCount=0;
  updateHUD(); startWave();
  if(!usingTouch) renderer.domElement.requestPointerLock();
}

/* ============ 射击 ============ */
let isFiring=false, lastShot=0, fireRate=100;
function shoot(){
  if(!playing||isDead) return;
  const now=performance.now(); if(now-lastShot<fireRate) return;
  if(mag<=0){ reload(); return; }
  lastShot=now; mag--; updateHUD(); gunRecoil=1; crossExpand=1; sShoot();
  fpWeapon.flash.visible=true; fpWeapon.flash.material.opacity=.95; fpWeapon.light.intensity=2.5;
  setTimeout(()=>{ fpWeapon.flash.visible=false; fpWeapon.light.intensity=0; },55);
  const from=new THREE.Vector3(); fpWeapon.muzzleObj.getWorldPosition(from);
  raycaster.setFromCamera(new THREE.Vector2(0,0),camera);
  const hits=raycaster.intersectObjects(scene.children,true);
  let to=from.clone().add(raycaster.ray.direction.clone().multiplyScalar(60));
  for(const h of hits){
    let root=h.object; while(root && !root.userData.isZombie) root=root.parent;
    if(root && root.userData.isZombie && !root.userData.dead){
      const isHead=(h.point.y > root.position.y+1.45);
      root.userData.hp -= isHead?75:25;
      createBlood(h.point); isHead?sHead():sHit(); showHitMarker();
      if(root.userData.hp<=0) killZombie(root);
      to=h.point.clone(); break;
    } else if(h.face){
      to=h.point.clone(); spawnSpark(h.point,0xdddddd); createBulletHole(h); createSmoke(h.point); break;
    }
  }
  createTracer(from,to); createSmoke(from,0.15);
}
function reload(){ if(mag===maxMag) return; sReload(); setTimeout(()=>{ mag=maxMag; updateHUD(); },1200); }

/* ============ 控制 ============ */
let yaw=0,pitch=0; const keys={}; let touchRun=false, joyVec={x:0,y:0};
document.addEventListener('mousemove',e=>{ if(document.pointerLockElement!==renderer.domElement) return;
  yaw-=e.movementX*.0022; pitch-=e.movementY*.0022; pitch=clamp(pitch,-1.5,1.5); camera.rotation.y=yaw; camera.rotation.x=pitch; });
document.addEventListener('mousedown',e=>{ if(e.button===0) isFiring=true; });
document.addEventListener('mouseup',e=>{ if(e.button===0) isFiring=false; });
document.addEventListener('keydown',e=>{ keys[e.code]=true; if(e.code==='KeyR') reload(); });
document.addEventListener('keyup',e=>{ keys[e.code]=false; });
renderer.domElement.addEventListener('click',()=>{ if(playing&&!usingTouch&&document.pointerLockElement!==renderer.domElement) renderer.domElement.requestPointerLock(); });
(function(){
  const jb=$('joyBase'), js=$('joyStick'); let jid=null;
  const upd=t=>{ const r=jb.getBoundingClientRect(); let dx=t.clientX-(r.left+r.width/2),dy=t.clientY-(r.top+r.height/2);
    const mx=r.width/2-10,d=Math.hypot(dx,dy); if(d>mx){dx=dx/d*mx;dy=dy/d*mx;} js.style.transform=`translate(${dx}px,${dy}px)`; joyVec={x:dx/mx,y:dy/mx}; };
  jb.addEventListener('touchstart',e=>{e.preventDefault();const t=e.changedTouches[0];jid=t.identifier;upd(t);},{passive:false});
  jb.addEventListener('touchmove',e=>{e.preventDefault();const t=[...e.changedTouches].find(t=>t.identifier===jid);if(t)upd(t);},{passive:false});
  const end=e=>{ if([...e.changedTouches].some(t=>t.identifier===jid)){jid=null;joyVec={x:0,y:0};js.style.transform='translate(0,0)';} };
  jb.addEventListener('touchend',end); jb.addEventListener('touchcancel',end);
  let lid=null,last={x:0,y:0};
  document.addEventListener('touchstart',e=>{ if(e.target.closest('#touchUI'))return; const t=e.changedTouches[0]; lid=t.identifier; last={x:t.clientX,y:t.clientY}; },{passive:false});
  document.addEventListener('touchmove',e=>{ if(lid===null)return; const t=[...e.changedTouches].find(t=>t.identifier===lid); if(!t)return;
    const dx=t.clientX-last.x,dy=t.clientY-last.y; last={x:t.clientX,y:t.clientY}; yaw-=dx*.005; pitch=clamp(pitch-dy*.005,-1.5,1.5); camera.rotation.y=yaw; camera.rotation.x=pitch; },{passive:false});
  document.addEventListener('touchend',e=>{ if([...e.changedTouches].some(t=>t.identifier===lid)) lid=null; });
  $('btnFire').addEventListener('touchstart',e=>{e.preventDefault();isFiring=true;},{passive:false});
  $('btnFire').addEventListener('touchend',e=>{e.preventDefault();isFiring=false;},{passive:false});
  $('btnReload').addEventListener('touchstart',e=>{e.preventDefault();reload();},{passive:false});
})();
const pbox=new THREE.Box3();
function collides(pos){ pbox.min.set(pos.x-.35,.1,pos.z-.35); pbox.max.set(pos.x+.35,1.8,pos.z+.35); for(const o of obstacles) if(pbox.intersectsBox(o)) return true; return false; }

/* ============ 小地图 ============ */
const map=$('map'),mctx=map.getContext('2d');
function drawMap(){ const W=map.width,H=map.height; mctx.clearRect(0,0,W,H); mctx.fillStyle='#111'; mctx.fillRect(0,0,W,H);
  mctx.strokeStyle='#555'; mctx.lineWidth=2; mctx.strokeRect(1,1,W-2,H-2);
  // 画集装箱
  mctx.fillStyle='#7f8c8d';
  [[-14,12,4,10],[-14,0,4,10],[-14,-12,4,10],[14,12,4,10],[14,0,4,10],[14,-12,4,10],[0,0,6,24],[-7,8,4,6],[-7,-8,4,6],[7,8,4,6],[7,-8,4,6]].forEach(([x,z,w,d])=>{
    mctx.fillRect((x-w/2+20)/40*W, (z-d/2+30)/60*H, w/40*W, d/60*H);
  });
  // 玩家（红点）
  const px=(camera.position.x+20)/40*W, py=(camera.position.z+30)/60*H;
  mctx.fillStyle='#e74c3c'; mctx.beginPath(); mctx.arc(px,py,3.5,0,Math.PI*2); mctx.fill();
  const fx=-Math.sin(camera.rotation.y), fz=-Math.cos(camera.rotation.y);
  mctx.strokeStyle='#e74c3c'; mctx.beginPath(); mctx.moveTo(px,py); mctx.lineTo(px+fx*10,py+fz*10); mctx.stroke();
  // 僵尸（绿点）
  mctx.fillStyle='#2ecc71'; zombies.forEach(z=>{ if(z.userData.dead) return; const nx=(z.position.x+20)/40*W, ny=(z.position.z+30)/60*H; mctx.beginPath(); mctx.arc(nx,ny,2.5,0,Math.PI*2); mctx.fill(); });
}

/* ============ 主循环 ============ */
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.1);
  const locked=document.pointerLockElement===renderer.domElement;
  const active=playing&&!isDead&&(locked||usingTouch);
  if(playing&&!locked&&!usingTouch){ $('prompt').style.display='block'; $('prompt').textContent='点击画面继续'; } else $('prompt').style.display='none';

  if(active){
    const speed=(keys['ShiftLeft']||keys['ShiftRight'])?5.0:3.0;
    const fwd=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw)); const rgt=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
    const mv=new THREE.Vector3();
    if(keys['KeyW']) mv.add(fwd); if(keys['KeyS']) mv.sub(fwd); if(keys['KeyD']) mv.add(rgt); if(keys['KeyA']) mv.sub(rgt);
    if(usingTouch&&(joyVec.x||joyVec.y)){ mv.addScaledVector(fwd,-joyVec.y); mv.addScaledVector(rgt,joyVec.x); }
    if(mv.lengthSq()>0){
      mv.normalize().multiplyScalar(speed*dt);
      const ox=camera.position.x, oz=camera.position.z;
      camera.position.x+=mv.x; if(collides(camera.position)) camera.position.x=ox;
      camera.position.z+=mv.z; if(collides(camera.position)) camera.position.z=oz;
      camera.position.x=clamp(camera.position.x,-19,19); camera.position.z=clamp(camera.position.z,-29,29);
    }
    if(isFiring) shoot();
    // 刷怪与波次
    if(zombiesToSpawn>0){
      spawnTimer-=dt; if(spawnTimer<=0){ spawnZombie(); zombiesToSpawn--; spawnTimer=Math.max(0.4, 1.5-wave*0.1); }
    } else if(aliveCount===0 && !waveClearing){
      waveClearing=true; setTimeout(()=>{ if(!isDead){ wave++; startWave(); } },3000);
    }
  }

  // 僵尸 AI
  for(let i=zombies.length-1;i>=0;i--){
    const z=zombies[i], ud=z.userData;
    if(ud.dying){
      ud.deathTimer-=dt; z.rotation.x=Math.min(Math.PI/2, z.rotation.x+dt*3);
      if(ud.deathTimer<=0){ scene.remove(z); zombies.splice(i,1); }
      continue;
    }
    if(ud.dead) continue;
    const dir=new THREE.Vector3().subVectors(camera.position, z.position); dir.y=0;
    const dist=dir.length();
    if(dist>1.6){
      dir.normalize(); const move=dir.multiplyScalar(ud.speed*dt);
      z.position.add(move);
      if(collides(z.position)) z.position.sub(move); // 简单碰撞，防止穿墙
      z.rotation.y=Math.atan2(dir.x,dir.z);
      if(ud.mixer){ ud.actions.walk.setEffectiveWeight(1); ud.actions.idle.setEffectiveWeight(0); }
    } else {
      if(ud.mixer){ ud.actions.walk.setEffectiveWeight(0); ud.actions.idle.setEffectiveWeight(1); }
      ud.lastAttack-=dt;
      if(ud.lastAttack<=0){ ud.lastAttack=1.0; playerTakeDamage(12); }
    }
    if(ud.mixer) ud.mixer.update(dt);
  }

  if(gunRecoil>0) gunRecoil=Math.max(0,gunRecoil-dt*4);
  fpWeapon.group.position.z=baseGunPos.z+gunRecoil*0.12; fpWeapon.group.rotation.x=-gunRecoil*0.25;
  crossExpand=Math.max(0,crossExpand-dt*4); $('crosshair').style.transform=`scale(${1+crossExpand*0.8})`;
  for(let i=tracers.length-1;i>=0;i--){ const t=tracers[i]; t.life-=dt; t.mesh.material.opacity=Math.max(0,t.life/0.12)*0.9; if(t.life<=0){scene.remove(t.mesh);t.mesh.geometry.dispose();tracers.splice(i,1);} }
  for(let i=smokes.length-1;i>=0;i--){ const s=smokes[i]; s.life-=dt; const k=s.life/s.max; s.spr.material.opacity=k*0.5; s.spr.scale.setScalar(s.sb+(1-k)*0.35); if(s.life<=0){scene.remove(s.spr);smokes.splice(i,1);} }
  for(let i=bloods.length-1;i>=0;i--){ const b=bloods[i]; b.life-=dt; b.m.position.add(b.v); b.v.y-=0.003; if(b.life<=0){scene.remove(b.m);b.m.geometry.dispose();b.m.material.dispose();bloods.splice(i,1);} }

  if(playing) drawMap();
  renderer.render(scene,camera);
}
$('menu').style.display='flex';
animate();
window.addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
</script>
