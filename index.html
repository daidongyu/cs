<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,user-scalable=no"
    />
    <title>局域网 CS</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        overflow: hidden;
        background: #000;
        font-family: 'Microsoft YaHei', sans-serif;
        user-select: none;
      }
      canvas {
        display: block;
      }
      #hudTopRight,
      #hudBottomRight,
      #crosshair,
      #hitmarker,
      #damageFlash,
      #prompt,
      #mapBox,
      #killFeed,
      #enemyInfo {
        position: absolute;
        z-index: 10;
        color: #fff;
        text-shadow: 0 1px 3px #000;
      }
      #hudTopRight {
        top: 12px;
        right: 12px;
        background: rgba(0, 0, 0, 0.45);
        padding: 8px 14px;
        border-radius: 10px;
        font-size: 16px;
      }
      #hudBottomRight {
        bottom: 12px;
        right: 12px;
        background: rgba(0, 0, 0, 0.45);
        padding: 8px 14px;
        border-radius: 10px;
        font-size: 16px;
        text-align: right;
      }
      #hudBottomRight div {
        margin: 2px 0;
      }
      #mapBox {
        left: 12px;
        bottom: 12px;
        background: rgba(0, 0, 0, 0.5);
        padding: 6px;
        border-radius: 10px;
      }
      #map {
        display: block;
        width: 180px;
        height: 144px;
        border-radius: 6px;
      }
      #crosshair {
        left: 50%;
        top: 50%;
        width: 22px;
        height: 22px;
        margin: -11px 0 0 -11px;
        pointer-events: none;
        transition: transform 0.08s;
      }
      #crosshair::before,
      #crosshair::after {
        content: '';
        position: absolute;
        background: #fff;
        box-shadow: 0 0 3px #000;
      }
      #crosshair::before {
        left: 10px;
        top: 0;
        width: 2px;
        height: 22px;
      }
      #crosshair::after {
        left: 0;
        top: 10px;
        width: 22px;
        height: 2px;
      }
      #hitmarker {
        left: 50%;
        top: 50%;
        width: 26px;
        height: 26px;
        margin: -13px 0 0 -13px;
        pointer-events: none;
        display: none;
      }
      #hitmarker::before,
      #hitmarker::after {
        content: '';
        position: absolute;
        background: #f00;
        box-shadow: 0 0 3px #000;
      }
      #hitmarker::before {
        left: 12px;
        top: 0;
        width: 2px;
        height: 26px;
        transform: rotate(45deg);
      }
      #hitmarker::after {
        left: 12px;
        top: 0;
        width: 2px;
        height: 26px;
        transform: rotate(-45deg);
      }
      #damageFlash {
        inset: 0;
        background: red;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s;
        z-index: 9;
      }
      #prompt {
        left: 50%;
        top: 60%;
        transform: translateX(-50%);
        font-size: 17px;
        color: #f1c40f;
        display: none;
        pointer-events: none;
      }
      #killFeed {
        top: 60px;
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
        font-size: 15px;
      }
      #killFeed div {
        margin: 2px 0;
        background: rgba(0, 0, 0, 0.35);
        padding: 2px 8px;
        border-radius: 4px;
        display: inline-block;
      }
      #enemyInfo {
        left: 50%;
        top: 56%;
        transform: translateX(-50%);
        text-align: center;
        display: none;
        z-index: 12;
      }
      #enemyName {
        font-size: 16px;
        color: #f39c12;
        margin-bottom: 2px;
      }
      #enemyHpBar {
        width: 150px;
        height: 8px;
        background: rgba(0, 0, 0, 0.5);
        border: 1px solid #fff;
        margin: 0 auto;
      }
      #enemyHpFill {
        height: 100%;
        background: #e74c3c;
        width: 100%;
      }
      #enemyHpText {
        font-size: 12px;
        margin-top: 2px;
      }
      #scoreboard {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        background: rgba(0, 0, 0, 0.85);
        padding: 20px 30px;
        border-radius: 12px;
        display: none;
        z-index: 30;
        color: #fff;
        min-width: 320px;
      }
      #scoreboard table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
      }
      #scoreboard th,
      #scoreboard td {
        padding: 6px 10px;
        border-bottom: 1px solid #555;
        text-align: left;
        font-size: 14px;
      }
      #scoreboard th {
        color: #f1c40f;
      }
      #overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(3px);
        z-index: 20;
      }
      .screen {
        display: none;
        flex-direction: column;
        align-items: center;
        background: rgba(20, 20, 20, 0.9);
        padding: 28px 40px;
        border-radius: 16px;
        text-align: center;
        color: #fff;
        max-width: 460px;
      }
      .screen h1 {
        margin: 0 0 10px;
        font-size: 26px;
      }
      .screen p {
        margin: 6px 0;
        font-size: 14px;
        color: #ddd;
        line-height: 1.7;
      }
      input,
      select {
        padding: 8px 12px;
        font-size: 15px;
        border-radius: 6px;
        border: none;
        margin: 6px 0;
        width: 80%;
      }
      button {
        cursor: pointer;
        border: none;
        border-radius: 8px;
        padding: 10px 20px;
        font-size: 15px;
        background: #3498db;
        color: #fff;
        margin-top: 10px;
      }
      button:hover {
        background: #2980b9;
      }
      .status {
        color: #f1c40f;
        margin-top: 10px;
        font-size: 14px;
        word-break: break-all;
      }
      #touchUI {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 15;
        display: none;
      }
      #joyBase {
        position: absolute;
        left: 20px;
        bottom: 20px;
        width: 120px;
        height: 120px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.18);
        border: 2px solid rgba(255, 255, 255, 0.35);
        pointer-events: auto;
        touch-action: none;
      }
      #joyStick {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 50px;
        height: 50px;
        margin: -25px 0 0 -25px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.55);
      }
      .tBtn {
        position: absolute;
        right: 20px;
        bottom: 20px;
        width: 84px;
        height: 84px;
        border-radius: 50%;
        font-size: 15px;
        color: #fff;
        pointer-events: auto;
        touch-action: none;
        border: none;
      }
      #btnFire {
        background: rgba(231, 76, 60, 0.9);
      }
      #btnReload {
        right: 116px;
        width: 70px;
        height: 70px;
        background: rgba(52, 152, 219, 0.9);
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div id="hudTopRight">❤ 血量：<span id="hp">100</span></div>
    <div id="hudBottomRight">
      <div>🔫 弹药：<span id="ammo">30 / ∞</span></div>
      <div>
        💀 击杀：<span id="kills">0</span>　☠ 死亡：<span id="deaths">0</span>
      </div>
    </div>
    <div id="mapBox"><canvas id="map" width="180" height="144"></canvas></div>
    <div id="crosshair"></div>
    <div id="hitmarker"></div>
    <div id="damageFlash"></div>
    <div id="prompt"></div>
    <div id="killFeed"></div>
    <div id="enemyInfo">
      <div id="enemyName"></div>
      <div id="enemyHpBar"><div id="enemyHpFill"></div></div>
      <div id="enemyHpText"></div>
    </div>
    <div id="scoreboard">
      <h3>🏆 记分板（按住 Tab 查看）</h3>
      <table>
        <thead>
          <tr>
            <th>名字</th>
            <th>队伍</th>
            <th>击杀</th>
            <th>死亡</th>
          </tr>
        </thead>
        <tbody id="sbBody"></tbody>
      </table>
    </div>

    <div id="touchUI">
      <div id="joyBase"><div id="joyStick"></div></div>
      <button class="tBtn" id="btnReload">换弹</button>
      <button class="tBtn" id="btnFire">射击</button>
    </div>

    <div id="overlay">
      <div id="menu" class="screen">
        <h1>🔫 生鲜超市 · 联机 CS</h1>
        <p>
          <b>电脑：</b>WASD 移动 · 鼠标看向 · 左键射击 · R 换弹(∞) · Tab 记分板
        </p>
        <p><b>手机：</b>左下摇杆移动 · 右侧滑动转视角 · 右下按钮射击/换弹</p>
        <input id="nameInput" placeholder="请输入你的名字" value="Player1" />
        <select id="teamSelect">
          <option value="CT">反恐精英 (CT · 蓝)</option>
          <option value="T">恐怖分子 (T · 红)</option>
        </select>
        <input id="roomInput" placeholder="房间ID（留空=创建房间）" />
        <button onclick="startGame()">开始游戏</button>
        <div id="loadStatus" class="status">正在加载玩家模型(Soldier.glb)…</div>
      </div>
      <div id="respawnScreen" class="screen">
        <h2>☠ 你被击倒了</h2>
        <p>等待重生…</p>
      </div>
    </div>

    <!-- Three.js 与 PeerJS（WebRTC） -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/environments/RoomEnvironment.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script>
      /* ============ 基础 ============ */
      const $ = (id) => document.getElementById(id)
      const clamp = (v, a, b) => Math.max(a, Math.min(b, v))
      let actx = null,
        noiseBuf = null
      function initAudio() {
        if (actx) {
          if (actx.state === 'suspended') actx.resume()
          return
        }
        actx = new (window.AudioContext || window.webkitAudioContext)()
        const len = actx.sampleRate * 0.2
        noiseBuf = actx.createBuffer(1, len, actx.sampleRate)
        const d = noiseBuf.getChannelData(0)
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1
      }
      function playBuf(buf, vol, dur, rate = 1) {
        if (!actx || !buf) return
        const s = actx.createBufferSource()
        s.buffer = buf
        s.playbackRate.value = rate
        const g = actx.createGain()
        g.gain.setValueAtTime(vol, actx.currentTime)
        g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur)
        s.connect(g)
        g.connect(actx.destination)
        s.start()
      }
      function beep(f, d, type = 'sine', vol = 0.15) {
        if (!actx) return
        const o = actx.createOscillator(),
          g = actx.createGain()
        o.type = type
        o.frequency.value = f
        o.connect(g)
        g.connect(actx.destination)
        g.gain.setValueAtTime(vol, actx.currentTime)
        g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + d)
        o.start()
        o.stop(actx.currentTime + d)
      }
      const sShoot = () => playBuf(noiseBuf, 0.18, 0.12, 1.2)
      const sHit = () => beep(1400, 0.05, 'square', 0.12)
      const sHead = () => {
        beep(2000, 0.06, 'square', 0.15)
        setTimeout(() => beep(2600, 0.06, 'square', 0.12), 60)
      }
      const sDeath = () => {
        beep(300, 0.25, 'sawtooth', 0.1)
        setTimeout(() => beep(180, 0.3, 'sawtooth', 0.1), 150)
      }
      const sReload = () => {
        beep(500, 0.06, 'square', 0.08)
        setTimeout(() => beep(700, 0.08, 'square', 0.08), 180)
      }

      /* ============ 场景 ============ */
      const scene = new THREE.Scene()
      scene.background = new THREE.Color(0xdfe6e9)
      scene.fog = new THREE.Fog(0xdfe6e9, 20, 52)
      const camera = new THREE.PerspectiveCamera(
        75,
        innerWidth / innerHeight,
        0.05,
        200,
      )
      camera.rotation.order = 'YXZ'
      const renderer = new THREE.WebGLRenderer({ antialias: true })
      renderer.setSize(innerWidth, innerHeight)
      renderer.shadowMap.enabled = true
      renderer.shadowMap.type = THREE.PCFSoftShadowMap
      renderer.outputEncoding = THREE.sRGBEncoding
      renderer.toneMapping = THREE.ACESFilmicToneMapping
      renderer.toneMappingExposure = 1.05
      document.body.insertBefore(renderer.domElement, document.body.firstChild)
      try {
        const pmrem = new THREE.PMREMGenerator(renderer)
        scene.environment = pmrem.fromScene(
          new THREE.RoomEnvironment(),
          0.04,
        ).texture
      } catch (e) {}
      scene.add(new THREE.AmbientLight(0xffffff, 0.35))
      const dirLight = new THREE.DirectionalLight(0xfff5e6, 0.8)
      dirLight.position.set(10, 20, 12)
      dirLight.castShadow = true
      dirLight.shadow.mapSize.width = dirLight.shadow.mapSize.height = 2048
      const sc = dirLight.shadow.camera
      sc.left = -22
      sc.right = 22
      sc.top = 22
      sc.bottom = -22
      sc.near = 0.5
      sc.far = 60
      scene.add(dirLight)

      function canvasTex(draw, rx, ry) {
        const c = document.createElement('canvas')
        c.width = c.height = 128
        draw(c.getContext('2d'))
        const t = new THREE.CanvasTexture(c)
        t.encoding = THREE.sRGBEncoding
        if (rx) {
          t.wrapS = t.wrapT = THREE.RepeatWrapping
          t.repeat.set(rx, ry)
        }
        return t
      }
      const floorTex = canvasTex(
        (x) => {
          x.fillStyle = '#ecf0f1'
          x.fillRect(0, 0, 128, 128)
          x.strokeStyle = '#bdc3c7'
          x.lineWidth = 3
          for (let i = 0; i <= 128; i += 32) {
            x.beginPath()
            x.moveTo(i, 0)
            x.lineTo(i, 128)
            x.stroke()
            x.beginPath()
            x.moveTo(0, i)
            x.lineTo(128, i)
            x.stroke()
          }
          x.fillStyle = 'rgba(149,165,166,.25)'
          for (let i = 0; i < 200; i++)
            x.fillRect(Math.random() * 128, Math.random() * 128, 2, 2)
        },
        16,
        13,
      )
      const woodTex = canvasTex((x) => {
        x.fillStyle = '#deb887'
        x.fillRect(0, 0, 128, 128)
        x.strokeStyle = '#c19a6b'
        x.lineWidth = 2
        for (let i = 0; i < 12; i++) {
          x.beginPath()
          x.moveTo(0, i * 11 + 2)
          x.bezierCurveTo(40, i * 11, 80, i * 11 + 6, 128, i * 11)
          x.stroke()
        }
      })
      const labelTex = (t, bg, fg) =>
        canvasTex((x) => {
          x.fillStyle = bg
          x.fillRect(0, 0, 128, 128)
          x.fillStyle = fg
          x.font = 'bold 40px sans-serif'
          x.textAlign = 'center'
          x.textBaseline = 'middle'
          x.fillText(t, 64, 66)
        })
      const scaleTex = canvasTex((x) => {
        x.fillStyle = '#2980b9'
        x.fillRect(0, 0, 128, 128)
        x.strokeStyle = '#154360'
        x.lineWidth = 2
        for (let r = 0; r < 8; r++)
          for (let c = 0; c < 8; c++) {
            x.beginPath()
            x.arc(c * 16 + 8, r * 16 + 8, 8, Math.PI, 0)
            x.stroke()
          }
      })
      scaleTex.wrapS = scaleTex.wrapT = THREE.RepeatWrapping
      scaleTex.repeat.set(2, 1)
      const holeTex = canvasTex((x) => {
        x.clearRect(0, 0, 128, 128)
        const g = x.createRadialGradient(64, 64, 0, 64, 64, 64)
        g.addColorStop(0, 'rgba(10,10,10,0.95)')
        g.addColorStop(0.6, 'rgba(30,30,30,0.8)')
        g.addColorStop(1, 'rgba(50,50,50,0)')
        x.fillStyle = g
        x.beginPath()
        x.arc(64, 64, 50, 0, Math.PI * 2)
        x.fill()
        x.fillStyle = 'rgba(0,0,0,0.9)'
        x.beginPath()
        x.arc(64, 64, 18, 0, Math.PI * 2)
        x.fill()
        for (let i = 0; i < 16; i++) {
          const a = Math.random() * Math.PI * 2,
            r = 20 + Math.random() * 40
          x.fillStyle = 'rgba(0,0,0,0.55)'
          x.beginPath()
          x.arc(
            64 + Math.cos(a) * r,
            64 + Math.sin(a) * r,
            4 + Math.random() * 5,
            0,
            Math.PI * 2,
          )
          x.fill()
        }
      })
      const smokeTex = canvasTex((x) => {
        const g = x.createRadialGradient(64, 64, 0, 64, 64, 64)
        g.addColorStop(0, 'rgba(220,220,220,0.7)')
        g.addColorStop(1, 'rgba(220,220,220,0)')
        x.fillStyle = g
        x.fillRect(0, 0, 128, 128)
      })

      const floor = new THREE.Mesh(
        new THREE.PlaneGeometry(30, 24),
        new THREE.MeshPhysicalMaterial({
          map: floorTex,
          roughness: 0.35,
          metalness: 0.02,
          clearcoat: 0.35,
          clearcoatRoughness: 0.2,
        }),
      )
      floor.rotation.x = -Math.PI / 2
      floor.receiveShadow = true
      scene.add(floor)
      const saleTex = canvasTex((x) => {
        x.fillStyle = '#e74c3c'
        x.fillRect(0, 0, 128, 128)
        x.fillStyle = '#fff'
        x.font = 'bold 46px sans-serif'
        x.textAlign = 'center'
        x.textBaseline = 'middle'
        x.fillText('SALE', 64, 64)
      })
      const sale = new THREE.Mesh(
        new THREE.PlaneGeometry(3, 3),
        new THREE.MeshBasicMaterial({ map: saleTex }),
      )
      sale.rotation.x = -Math.PI / 2
      sale.position.set(0, 0.012, 5)
      scene.add(sale)
      const ceil = new THREE.Mesh(
        new THREE.PlaneGeometry(30, 24),
        new THREE.MeshStandardMaterial({ color: 0xf5f6fa, roughness: 0.9 }),
      )
      ceil.rotation.x = Math.PI / 2
      ceil.position.y = 3.2
      scene.add(ceil)
      const lightMat = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        emissive: 0xffffff,
        emissiveIntensity: 1,
      })
      ;[0xfff0dd, 0xffffff, 0xddeeff].forEach((lc) => {
        ;[7, 0, -7].forEach((lz) => {
          ;[-8, 0, 8].forEach((lx) => {
            const p = new THREE.Mesh(
              new THREE.BoxGeometry(4, 0.05, 1),
              lightMat,
            )
            p.position.set(lx, 3.16, lz)
            scene.add(p)
            const pl = new THREE.PointLight(lc, 0.26, 14)
            pl.position.set(lx, 2.9, lz)
            scene.add(pl)
          })
        })
      })

      const obstacles = []
      function addWall(cx, cz, w, d) {
        const m = new THREE.Mesh(
          new THREE.BoxGeometry(w, 3, d),
          new THREE.MeshStandardMaterial({ color: 0xecf0f1, roughness: 0.95 }),
        )
        m.position.set(cx, 1.5, cz)
        m.receiveShadow = true
        scene.add(m)
        obstacles.push(new THREE.Box3().setFromObject(m))
      }
      addWall(0, -12, 30, 1)
      addWall(-15, 0, 1, 24)
      addWall(15, 0, 1, 24)
      addWall(-9, 12, 12, 1)
      addWall(9, 12, 12, 1)
      const glassMat = new THREE.MeshPhysicalMaterial({
        color: 0xaed6f1,
        transparent: true,
        opacity: 0.25,
        roughness: 0.05,
        metalness: 0.5,
        clearcoat: 1,
      })
      ;[-1.6, 1.6].forEach((x) => {
        const d = new THREE.Mesh(
          new THREE.BoxGeometry(2.8, 2.4, 0.08),
          glassMat,
        )
        d.position.set(x, 1.2, 11.6)
        scene.add(d)
      })
      function createPlant(x, z) {
        const g = new THREE.Group()
        const pot = new THREE.Mesh(
          new THREE.CylinderGeometry(0.28, 0.22, 0.4, 12),
          new THREE.MeshStandardMaterial({ color: 0x8d6e63 }),
        )
        pot.position.y = 0.2
        g.add(pot)
        const leaf = new THREE.Mesh(
          new THREE.IcosahedronGeometry(0.42, 1),
          new THREE.MeshStandardMaterial({
            color: 0x27ae60,
            flatShading: true,
            roughness: 0.9,
          }),
        )
        leaf.position.y = 0.75
        g.add(leaf)
        g.position.set(x, 0, z)
        scene.add(g)
        obstacles.push(new THREE.Box3().setFromObject(g))
      }
      createPlant(-13.5, 9.5)
      createPlant(13.5, 9.5)
      function createBasket(x, z) {
        for (let i = 0; i < 3; i++) {
          const b = new THREE.Mesh(
            new THREE.BoxGeometry(0.5, 0.3, 0.36),
            new THREE.MeshStandardMaterial({ color: 0xe74c3c, roughness: 0.7 }),
          )
          b.position.set(x, 0.15 + i * 0.31, z)
          scene.add(b)
        }
      }
      createBasket(-3, 10)
      createBasket(3, 10)

      const shelfRects = []
      const shelfRows = [4, 0, -4]
      function createShelf(z) {
        const g = new THREE.Group()
        const metal = new THREE.MeshStandardMaterial({
          color: 0x95a5a6,
          metalness: 0.8,
          roughness: 0.3,
        })
        const wood = new THREE.MeshStandardMaterial({
          map: woodTex,
          roughness: 0.7,
        })
        const L = 18,

                '\n\n请让同局域网好友打开同一个网址，在“房间ID”输入框中输入此ID，然后点击“开始游戏”加入。\n（顶部横幅也会一直显示这个ID）',
            )

            camera.position.set(spawn.x, 1.6, spawn.z)
            startLocal()
            peer.on('connection', (conn) => {
              conn.on('open', () => {
                clients[conn.peer] = conn
                conn.on('data', (d) => handleNet(d, conn))
                conn.on('close', () => {
                  delete clients[conn.peer]
                  if (players[conn.peer]) {
                    removeRemotePlayer(conn.peer)
                    delete players[conn.peer]
                    broadcast({ type: 'playerLeft', id: conn.peer })
                    broadcastScore()
                  }
                })
              })
            })
            // ==========================
          } else {
            // ===== 加入房间（客户端，原样不动）=====
            isHost = false
            hostConn = peer.connect(room, { reliable: true })
            hostConn.on('open', () => {
              $('loadStatus').textContent = '✅ 已连接主机，等待游戏开始…'
              hostConn.send({ type: 'join', name: myName, team: myTeam })
            })
            hostConn.on('data', (d) => handleNet(d, hostConn))
            hostConn.on('error', (e) => {
              alert('连接主机失败：' + e)
            })
          }
        })
        peer.on('error', (e) => {
          console.error(e)
        })
      }
      function startLocal() {
        playing = true
        health = 100
        mag = maxMag
        kills = 0
        deaths = 0
        isDead = false
        updateHUD()
        $('menu').style.display = 'none'
        $('overlay').style.display = 'none'
        if (!usingTouch) renderer.domElement.requestPointerLock()
      }
      function handleNet(msg, conn) {
        // 主机收到客户端输入
        if (msg.type === 'join' && isHost) {
          const pid = conn.peer
          const spawn = getSpawn(msg.team)
          players[pid] = {
            name: msg.name,
            team: msg.team,
            kills: 0,
            deaths: 0,
            hp: 100,
            x: spawn.x,
            z: spawn.z,
            rot: 0,
            moving: false,
          }
          conn.send({
            type: 'welcome',
            id: pid,
            spawn,
            players: Object.entries(players)
              .filter(([i]) => i !== pid)
              .map(([i, p]) => ({
                id: i,
                name: p.name,
                team: p.team,
                spawn: { x: p.x, y: 0, z: p.z },
                hp: p.hp,
              })),
          })
          addRemotePlayer(pid, msg.name, msg.team, spawn, 100)
          broadcast(
            {
              type: 'playerJoined',
              id: pid,
              name: msg.name,
              team: msg.team,
              spawn,
            },
            pid,
          )
          broadcastScore()
        } else if (msg.type === 'update') {
          if (isHost && conn) {
            const pid = conn.peer
            if (players[pid]) {
              players[pid].x = msg.x
              players[pid].z = msg.z
              players[pid].rot = msg.rot
              players[pid].moving = msg.moving
            }
            broadcast(
              {
                type: 'update',
                id: pid,
                x: msg.x,
                y: 0,
                z: msg.z,
                rot: msg.rot,
                moving: msg.moving,
              },
              pid,
            )
          }
          // 客户端收到主机转发的他人更新
          if (players[msg.id] && msg.id !== myId) {
            players[msg.id].targetPos.set(msg.x, 0, msg.z)
            players[msg.id].targetRot = msg.rot
            players[msg.id].moving = msg.moving
          }
        } else if (msg.type === 'shoot') {
          const shooterId = msg.id || (conn ? conn.peer : myId)
          const p = players[shooterId]
          if (p && p.weapon) {
            p.weapon.flash.visible = true
            p.weapon.flash.material.opacity = 0.95
            p.weapon.light.intensity = 2.5
            setTimeout(() => {
              if (p && p.weapon) {
                p.weapon.flash.visible = false
                p.weapon.light.intensity = 0
              }
            }, 55)
          }
          const f = new THREE.Vector3(msg.from.x, msg.from.y, msg.from.z)
          const d = new THREE.Vector3(msg.dir.x, msg.dir.y, msg.dir.z)
          createTracer(f, f.clone().add(d.multiplyScalar(60)))
          createSmoke(f, 0.15)
          sShoot()
          if (isHost && conn)
            broadcast(
              { type: 'shoot', id: shooterId, from: msg.from, dir: msg.dir },
              conn.peer,
            )
        } else if (msg.type === 'hit' && isHost) {
          const v = players[msg.victimId]
          if (v && v.hp > 0) {
            v.hp -= msg.damage
            if (v.hp < 0) v.hp = 0
            broadcast({ type: 'hp', id: msg.victimId, hp: v.hp })
            if (v.hp <= 0) {
              const killer = players[conn ? conn.peer : myId]
              if (killer) killer.kills++
              v.deaths++
              broadcast({
                type: 'kill',
                killerName: killer ? killer.name : 'Unknown',
                victimName: v.name,
                killerTeam: killer ? killer.team : '',
                victimTeam: v.team,
              })
              broadcastScore()
              broadcast({ type: 'playerDied', id: msg.victimId })
              if (clients[msg.victimId])
                clients[msg.victimId].send({ type: 'died' })
            }
          }
        } else if (msg.type === 'respawn' && isHost && conn) {
          const pid = conn.peer
          const p = players[pid]
          if (p) {
            p.hp = 100
            const sp = getSpawn(p.team)
            p.x = sp.x
            p.z = sp.z
            broadcast({ type: 'respawn', id: pid, spawn: sp, hp: 100 })
          }
        }
        // 客户端 & 主机都会收到的状态消息
        if (msg.type === 'welcome') {
          myId = msg.id
          camera.position.set(msg.spawn.x, 1.6, msg.spawn.z)
          msg.players.forEach((p) =>
            addRemotePlayer(p.id, p.name, p.team, p.spawn, p.hp),
          )
          startLocal()
        } else if (msg.type === 'playerJoined') {
          addRemotePlayer(msg.id, msg.name, msg.team, msg.spawn, 100)
        } else if (msg.type === 'playerLeft') {
          removeRemotePlayer(msg.id)
          delete players[msg.id]
        } else if (msg.type === 'hp') {
          if (players[msg.id]) players[msg.id].hp = msg.hp
          if (msg.id === myId) {
            health = msg.hp
            flashDamage()
            updateHUD()
          }
        } else if (msg.type === 'died') {
          isDead = true
          respawnTimer = 3
          $('respawnScreen').style.display = 'flex'
          $('overlay').style.display = 'flex'
        } else if (msg.type === 'playerDied') {
          const p = players[msg.id]
          if (p) {
            p.dead = true
            p.deathTimer = 3
          }
        } else if (msg.type === 'respawn') {
          const p = players[msg.id]
          if (p) {
            p.hp = 100
            p.dead = false
            p.deathTimer = 0
            p.model.visible = true
            p.model.rotation.set(0, p.targetRot, 0)
            p.model.position.set(msg.spawn.x, 0, msg.spawn.z)
          }
          if (msg.id === myId) {
            health = 100
            isDead = false
            camera.position.set(msg.spawn.x, 1.6, msg.spawn.z)
            updateHUD()
            $('respawnScreen').style.display = 'none'
            $('overlay').style.display = 'none'
          }
        } else if (msg.type === 'kill') {
          addKillFeed(
            msg.killerName,
            msg.victimName,
            msg.killerTeam,
            msg.victimTeam,
          )
        } else if (msg.type === 'scoreboard') {
          const tb = $('sbBody')
          tb.innerHTML = ''
          msg.data.forEach((p) => {
            const tr = document.createElement('tr')
            tr.innerHTML = `<td>${p.name}</td><td>${p.team === 'T' ? '恐怖分子' : '反恐精英'}</td><td>${p.kills}</td><td>${p.deaths}</td>`
            tb.appendChild(tr)
          })
        }
      }

      /* ============ 射击 ============ */
      let isFiring = false,
        lastShot = 0,
        fireRate = 100
      function shoot() {
        if (!playing || isDead) return
        const now = performance.now()
        if (now - lastShot < fireRate) return
        if (mag <= 0) {
          reload()
          return
        }
        lastShot = now
        mag--
        updateHUD()
        gunRecoil = 1
        crossExpand = 1
        sShoot()
        fpWeapon.flash.visible = true
        fpWeapon.flash.material.opacity = 0.95
        fpWeapon.light.intensity = 2.5
        setTimeout(() => {
          fpWeapon.flash.visible = false
          fpWeapon.light.intensity = 0
        }, 55)
        const from = new THREE.Vector3()
        fpWeapon.muzzleObj.getWorldPosition(from)
        raycaster.setFromCamera(new THREE.Vector2(0, 0), camera)
        const hits = raycaster.intersectObjects(scene.children, true)
        let to = from
          .clone()
          .add(raycaster.ray.direction.clone().multiplyScalar(60))
        let victimId = null,
          dmg = 0
        for (const h of hits) {
          let root = h.object
          while (root && !root.userData.playerId) root = root.parent
          if (root && root.userData.playerId) {
            victimId = root.userData.playerId
            const isHead = h.point.y > root.position.y + 1.45
            dmg = isHead ? 75 : 25
            createBlood(h.point)
            isHead ? sHead() : sHit()
            showHitMarker()
            to = h.point.clone()
            break
          } else if (h.face) {
            to = h.point.clone()
            spawnSpark(h.point, 0xdddddd)
            createBulletHole(h)
            createSmoke(h.point)
            break
          }
        }
        createTracer(from, to)
        createSmoke(from, 0.15)
        const shootMsg = {
          type: 'shoot',
          from: { x: from.x, y: from.y, z: from.z },
          dir: {
            x: raycaster.ray.direction.x,
            y: raycaster.ray.direction.y,
            z: raycaster.ray.direction.z,
          },
        }
        if (isHost) {
          shootMsg.id = myId
          handleNet(shootMsg, null)
          broadcast(shootMsg, myId)
        } else {
          sendToHost(shootMsg)
        }
        if (victimId) {
          const hitMsg = { type: 'hit', victimId, damage: dmg }
          if (isHost) handleNet(hitMsg, null)
          else sendToHost(hitMsg)
        }
      }
      function reload() {
        if (mag === maxMag) return
        sReload()
        setTimeout(() => {
          mag = maxMag
          updateHUD()
        }, 1400)
      }

      /* ============ 控制 ============ */
      let yaw = 0,
        pitch = 0
      const keys = {}
      let usingTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0
      if (usingTouch) $('touchUI').style.display = 'block'
      let joyVec = { x: 0, y: 0 }
      document.addEventListener('mousemove', (e) => {
        if (document.pointerLockElement !== renderer.domElement) return
        yaw -= e.movementX * 0.0022
        pitch -= e.movementY * 0.0022
        pitch = clamp(pitch, -1.5, 1.5)
        camera.rotation.y = yaw
        camera.rotation.x = pitch
      })
      document.addEventListener('mousedown', (e) => {
        if (e.button === 0) isFiring = true
      })
      document.addEventListener('mouseup', (e) => {
        if (e.button === 0) isFiring = false
      })
      document.addEventListener('keydown', (e) => {
        keys[e.code] = true
        if (e.code === 'KeyR') reload()
        if (e.code === 'Tab') {
          e.preventDefault()
          $('scoreboard').style.display = 'block'
        }
      })
      document.addEventListener('keyup', (e) => {
        keys[e.code] = false
        if (e.code === 'Tab') $('scoreboard').style.display = 'none'
      })
      renderer.domElement.addEventListener('click', () => {
        if (
          playing &&
          !usingTouch &&
          document.pointerLockElement !== renderer.domElement
        )
          renderer.domElement.requestPointerLock()
      })
      ;(function () {
        const jb = $('joyBase'),
          js = $('joyStick')
        let jid = null
        const upd = (t) => {
          const r = jb.getBoundingClientRect()
          let dx = t.clientX - (r.left + r.width / 2),
            dy = t.clientY - (r.top + r.height / 2)
          const mx = r.width / 2 - 10,
            d = Math.hypot(dx, dy)
          if (d > mx) {
            dx = (dx / d) * mx
            dy = (dy / d) * mx
          }
          js.style.transform = `translate(${dx}px,${dy}px)`
          joyVec = { x: dx / mx, y: dy / mx }
        }
        jb.addEventListener(
          'touchstart',
          (e) => {
            e.preventDefault()
            const t = e.changedTouches[0]
            jid = t.identifier
            upd(t)
          },
          { passive: false },
        )
        jb.addEventListener(
          'touchmove',
          (e) => {
            e.preventDefault()
            const t = [...e.changedTouches].find((t) => t.identifier === jid)
            if (t) upd(t)
          },
          { passive: false },
        )
        const end = (e) => {
          if ([...e.changedTouches].some((t) => t.identifier === jid)) {
            jid = null
            joyVec = { x: 0, y: 0 }
            js.style.transform = 'translate(0,0)'
          }
        }
        jb.addEventListener('touchend', end)
        jb.addEventListener('touchcancel', end)
        let lid = null,
          last = { x: 0, y: 0 }
        document.addEventListener(
          'touchstart',
          (e) => {
            if (e.target.closest('#touchUI')) return
            const t = e.changedTouches[0]
            lid = t.identifier
            last = { x: t.clientX, y: t.clientY }
          },
          { passive: false },
        )
        document.addEventListener(
          'touchmove',
          (e) => {
            if (lid === null) return
            const t = [...e.changedTouches].find((t) => t.identifier === lid)
            if (!t) return
            const dx = t.clientX - last.x,
              dy = t.clientY - last.y
            last = { x: t.clientX, y: t.clientY }
            yaw -= dx * 0.005
            pitch = clamp(pitch - dy * 0.005, -1.5, 1.5)
            camera.rotation.y = yaw
            camera.rotation.x = pitch
          },
          { passive: false },
        )
        document.addEventListener('touchend', (e) => {
          if ([...e.changedTouches].some((t) => t.identifier === lid))
            lid = null
        })
        $('btnFire').addEventListener(
          'touchstart',
          (e) => {
            e.preventDefault()
            isFiring = true
          },
          { passive: false },
        )
        $('btnFire').addEventListener(
          'touchend',
          (e) => {
            e.preventDefault()
            isFiring = false
          },
          { passive: false },
        )
        $('btnReload').addEventListener(
          'touchstart',
          (e) => {
            e.preventDefault()
            reload()
          },
          { passive: false },
        )
      })()
      const pbox = new THREE.Box3()
      function collides(pos) {
        pbox.min.set(pos.x - 0.35, 0.1, pos.z - 0.35)
        pbox.max.set(pos.x + 0.35, 1.8, pos.z + 0.35)
        for (const o of obstacles) if (pbox.intersectsBox(o)) return true
        return false
      }

      /* ============ 小地图 & 瞄准 ============ */
      const map = $('map'),
        mctx = map.getContext('2d')
      function drawMap() {
        const W = map.width,
          H = map.height
        mctx.clearRect(0, 0, W, H)
        mctx.fillStyle = '#2d3436'
        mctx.fillRect(0, 0, W, H)
        mctx.strokeStyle = '#636e72'
        mctx.lineWidth = 2
        mctx.strokeRect(1, 1, W - 2, H - 2)
        mctx.fillStyle = '#7f8c8d'
        shelfRects.forEach((r) =>
          mctx.fillRect(
            ((r.x + 15) / 30) * W,
            ((r.z - 0.6 + 12) / 24) * H,
            (18 / 30) * W,
            (1.2 / 24) * H,
          ),
        )
        mctx.fillStyle = '#27ae60'
        checkoutRects.forEach((r) =>
          mctx.fillRect(
            ((r.x - 1.25 + 15) / 30) * W,
            ((r.z - 0.6 + 12) / 24) * H,
            (2.5 / 30) * W,
            (1.2 / 24) * H,
          ),
        )
        const px = ((camera.position.x + 15) / 30) * W,
          py = ((camera.position.z + 12) / 24) * H
        mctx.fillStyle = '#e74c3c'
        mctx.beginPath()
        mctx.arc(px, py, 3.5, 0, Math.PI * 2)
        mctx.fill()
        const fx = -Math.sin(camera.rotation.y),
          fz = -Math.cos(camera.rotation.y)
        mctx.strokeStyle = '#e74c3c'
        mctx.beginPath()
        mctx.moveTo(px, py)
        mctx.lineTo(px + fx * 10, py + fz * 10)
        mctx.stroke()
        Object.values(players).forEach((p) => {
          if (!p.model) return
          const nx = ((p.model.position.x + 15) / 30) * W,
            ny = ((p.model.position.z + 12) / 24) * H
          mctx.fillStyle = p.team === 'T' ? '#e74c3c' : '#3498db'
          mctx.beginPath()
          mctx.arc(nx, ny, 3, 0, Math.PI * 2)
          mctx.fill()
        })
      }
      function updateAimHUD() {
        raycaster.setFromCamera(new THREE.Vector2(0, 0), camera)
        const models = Object.values(players)
          .filter((p) => !p.dead && p.model)
          .map((p) => p.model)
        const hits = raycaster.intersectObjects(models, true)
        if (hits.length) {
          let o = hits[0].object
          while (o && !o.userData.playerId) o = o.parent
          if (o) {
            const p = players[o.userData.playerId]
            if (p && !p.dead) {
              $('enemyInfo').style.display = 'block'
              $('enemyName').textContent = p.name
              $('enemyHpText').textContent = p.hp + ' / 100'
              $('enemyHpFill').style.width = p.hp + '%'
              return
            }
          }
        }
        $('enemyInfo').style.display = 'none'
      }

      /* ============ 主循环 ============ */
      const clock = new THREE.Clock()
      function animate() {
        requestAnimationFrame(animate)
        const dt = Math.min(clock.getDelta(), 0.1)
        const locked = document.pointerLockElement === renderer.domElement
        const active = playing && !isDead && (locked || usingTouch)
        if (playing && !locked && !usingTouch) {
          $('prompt').style.display = 'block'
          $('prompt').textContent = '点击画面继续'
        } else $('prompt').style.display = 'none'
        if (active) {
          const speed = 3.0
          const fwd = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw))
          const rgt = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw))
          const mv = new THREE.Vector3()
          if (keys['KeyW']) mv.add(fwd)
          if (keys['KeyS']) mv.sub(fwd)
          if (keys['KeyD']) mv.add(rgt)
          if (keys['KeyA']) mv.sub(rgt)
          if (usingTouch && (joyVec.x || joyVec.y)) {
            mv.addScaledVector(fwd, -joyVec.y)
            mv.addScaledVector(rgt, joyVec.x)
          }
          isMoving = mv.lengthSq() > 0
          if (isMoving) {
            mv.normalize().multiplyScalar(speed * dt)
            const ox = camera.position.x,
              oz = camera.position.z
            camera.position.x += mv.x
            if (collides(camera.position)) camera.position.x = ox
            camera.position.z += mv.z
            if (collides(camera.position)) camera.position.z = oz
            camera.position.x = clamp(camera.position.x, -14.2, 14.2)
            camera.position.z = clamp(camera.position.z, -11.2, 11.2)
          }
          if (isFiring) shoot()
          // 网络同步
          netTimer += dt
          if (netTimer > 0.066) {
            netTimer = 0
            const upd = {
              x: camera.position.x,
              z: camera.position.z,
              rot: yaw,
              moving: isMoving,
            }
            if (isHost) {
              players[myId].x = upd.x
              players[myId].z = upd.z
              players[myId].rot = upd.rot
              players[myId].moving = upd.moving
              broadcast({
                type: 'update',
                id: myId,
                x: upd.x,
                y: 0,
                z: upd.z,
                rot: upd.rot,
                moving: upd.moving,
              })
            } else {
              sendToHost({
                type: 'update',
                x: upd.x,
                y: 0,
                z: upd.z,
                rot: upd.rot,
                moving: upd.moving,
              })
            }
          }
          updateAimHUD()
        } else {
          $('enemyInfo').style.display = 'none'
          if (isDead) {
            respawnTimer -= dt
            if (respawnTimer <= 0) {
              if (!usingTouch) renderer.domElement.requestPointerLock()
              if (isHost) {
                const sp = getSpawn(players[myId].team)
                players[myId].hp = 100
                players[myId].x = sp.x
                players[myId].z = sp.z
                camera.position.set(sp.x, 1.6, sp.z)
                health = 100
                isDead = false
                updateHUD()
                $('respawnScreen').style.display = 'none'
                $('overlay').style.display = 'none'
                broadcast({ type: 'respawn', id: myId, spawn: sp, hp: 100 })
              } else {
                sendToHost({ type: 'respawn' })
              }
            }
          }
        }
        if (gunRecoil > 0) gunRecoil = Math.max(0, gunRecoil - dt * 4)
        fpWeapon.group.position.z = baseGunPos.z + gunRecoil * 0.12
        fpWeapon.group.rotation.x = -gunRecoil * 0.25
        crossExpand = Math.max(0, crossExpand - dt * 4)
        $('crosshair').style.transform = `scale(${1 + crossExpand * 0.8})`
        for (let i = tracers.length - 1; i >= 0; i--) {
          const t = tracers[i]
          t.life -= dt
          t.mesh.material.opacity = Math.max(0, t.life / 0.12) * 0.9
          if (t.life <= 0) {
            scene.remove(t.mesh)
            t.mesh.geometry.dispose()
            tracers.splice(i, 1)
          }
        }
        for (let i = smokes.length - 1; i >= 0; i--) {
          const s = smokes[i]
          s.life -= dt
          const k = s.life / s.max
          s.spr.material.opacity = k * 0.5
          s.spr.scale.setScalar(s.sb + (1 - k) * 0.35)
          if (s.life <= 0) {
            scene.remove(s.spr)
            smokes.splice(i, 1)
          }
        }
        for (let i = bloods.length - 1; i >= 0; i--) {
          const b = bloods[i]
          b.life -= dt
          b.m.position.add(b.v)
          b.v.y -= 0.003
          if (b.life <= 0) {
            scene.remove(b.m)
            b.m.geometry.dispose()
            b.m.material.dispose()
            bloods.splice(i, 1)
          }
        }
        Object.values(players).forEach((p) => {
          if (p.dead) {
            p.deathTimer -= dt
            p.model.rotation.x = Math.min(
              Math.PI / 2,
              p.model.rotation.x + dt * 3,
            )
            if (p.deathTimer <= 0) p.model.visible = false
          } else if (p.model) {
            p.model.position.lerp(p.targetPos, 0.2)
            p.model.rotation.y = p.targetRot
            p.actions.walk.setEffectiveWeight(p.moving ? 1 : 0)
            p.actions.idle.setEffectiveWeight(p.moving ? 0 : 1)
            p.mixer.update(dt)
          }
        })
        if (playing) drawMap()
        renderer.render(scene, camera)
      }
      $('menu').style.display = 'flex'
      animate()
      window.addEventListener('resize', () => {
        camera.aspect = innerWidth / innerHeight
        camera.updateProjectionMatrix()
        renderer.setSize(innerWidth, innerHeight)
      })
    </script>
  </body>
</html>
