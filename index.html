<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,user-scalable=no"
    />
    <title>3D 生鲜超市 FPS（真实士兵·弹道特效·修正模型404）</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        overflow: hidden;
        background: #000;
        font-family: 'Microsoft YaHei', sans-serif;
        user-select: none;
      }
      canvas {
        display: block;
      }
      #hudTopRight,
      #hudBottomRight,
      #crosshair,
      #hitmarker,
      #damageFlash,
      #prompt,
      #mapBox {
        position: absolute;
        z-index: 10;
        color: #fff;
        text-shadow: 0 1px 3px #000;
      }
      #hudTopRight {
        top: 12px;
        right: 12px;
        background: rgba(0, 0, 0, 0.45);
        padding: 8px 14px;
        border-radius: 10px;
        font-size: 16px;
      }
      #hudBottomRight {
        bottom: 12px;
        right: 12px;
        background: rgba(0, 0, 0, 0.45);
        padding: 8px 14px;
        border-radius: 10px;
        font-size: 16px;
        text-align: right;
      }
      #hudBottomRight div {
        margin: 2px 0;
      }
      #mapBox {
        left: 12px;
        bottom: 12px;
        background: rgba(0, 0, 0, 0.5);
        padding: 6px;
        border-radius: 10px;
      }
      #map {
        display: block;
        width: 180px;
        height: 144px;
        border-radius: 6px;
      }
      #crosshair {
        left: 50%;
        top: 50%;
        width: 22px;
        height: 22px;
        margin: -11px 0 0 -11px;
        pointer-events: none;
        transition: transform 0.08s;
      }
      #crosshair::before,
      #crosshair::after {
        content: '';
        position: absolute;
        background: #fff;
        box-shadow: 0 0 3px #000;
      }
      #crosshair::before {
        left: 10px;
        top: 0;
        width: 2px;
        height: 22px;
      }
      #crosshair::after {
        left: 0;
        top: 10px;
        width: 22px;
        height: 2px;
      }
      #hitmarker {
        left: 50%;
        top: 50%;
        width: 26px;
        height: 26px;
        margin: -13px 0 0 -13px;
        pointer-events: none;
        display: none;
      }
      #hitmarker::before,
      #hitmarker::after {
        content: '';
        position: absolute;
        background: #f00;
        box-shadow: 0 0 3px #000;
      }
      #hitmarker::before {
        left: 12px;
        top: 0;
        width: 2px;
        height: 26px;
        transform: rotate(45deg);
      }
      #hitmarker::after {
        left: 12px;
        top: 0;
        width: 2px;
        height: 26px;
        transform: rotate(-45deg);
      }
      #damageFlash {
        inset: 0;
        background: red;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s;
        z-index: 9;
      }
      #prompt {
        left: 50%;
        top: 60%;
        transform: translateX(-50%);
        font-size: 17px;
        color: #f1c40f;
        display: none;
        pointer-events: none;
      }
      #overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(3px);
        z-index: 20;
      }
      .screen {
        display: none;
        flex-direction: column;
        align-items: center;
        background: rgba(20, 20, 20, 0.88);
        padding: 28px 40px;
        border-radius: 16px;
        text-align: center;
        color: #fff;
        max-width: 480px;
      }
      .screen h1 {
        margin: 0 0 10px;
        font-size: 28px;
      }
      .screen h2 {
        margin: 0 0 10px;
        font-size: 26px;
      }
      .screen p {
        margin: 6px 0;
        font-size: 14px;
        color: #ddd;
        line-height: 1.7;
      }
      .btns {
        margin-top: 14px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: center;
      }
      button {
        cursor: pointer;
        border: none;
        border-radius: 8px;
        padding: 10px 16px;
        font-size: 15px;
        background: #3498db;
        color: #fff;
        transition: 0.15s;
      }
      button:hover {
        background: #2980b9;
        transform: translateY(-1px);
      }
      .status {
        color: #f1c40f;
        margin-top: 10px;
        font-size: 14px;
      }
      #touchUI {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 15;
        display: none;
      }
      #joyBase {
        position: absolute;
        left: 20px;
        bottom: 20px;
        width: 120px;
        height: 120px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.18);
        border: 2px solid rgba(255, 255, 255, 0.35);
        pointer-events: auto;
        touch-action: none;
      }
      #joyStick {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 50px;
        height: 50px;
        margin: -25px 0 0 -25px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.55);
      }
      .tBtn {
        position: absolute;
        right: 20px;
        bottom: 20px;
        width: 84px;
        height: 84px;
        border-radius: 50%;
        font-size: 15px;
        color: #fff;
        pointer-events: auto;
        touch-action: none;
        border: none;
      }
      #btnFire {
        background: rgba(231, 76, 60, 0.9);
      }
      #btnReload {
        right: 116px;
        width: 70px;
        height: 70px;
        background: rgba(52, 152, 219, 0.9);
        font-size: 13px;
      }
      #btnRun {
        right: 20px;
        bottom: 116px;
        width: 70px;
        height: 70px;
        background: rgba(155, 89, 182, 0.9);
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div id="hudTopRight">❤ 血量：<span id="hp">100</span></div>
    <div id="hudBottomRight">
      <div>🔫 弹药：<span id="ammo">30 / 120</span></div>
      <div>🌊 波次：<span id="wave">1</span></div>
      <div>💀 击杀：<span id="kills">0</span></div>
    </div>
    <div id="mapBox"><canvas id="map" width="180" height="144"></canvas></div>
    <div id="crosshair"></div>
    <div id="hitmarker"></div>
    <div id="damageFlash"></div>
    <div id="prompt"></div>

    <div id="touchUI">
      <div id="joyBase"><div id="joyStick"></div></div>
      <button class="tBtn" id="btnRun">疾走</button>
      <button class="tBtn" id="btnReload">换弹</button>
      <button class="tBtn" id="btnFire">射击</button>
    </div>

    <div id="overlay">
      <div id="menu" class="screen">
        <h1>🔫 生鲜超市 FPS（真实士兵）</h1>
        <p>
          <b>电脑：</b>WASD 移动 · 鼠标看向 · <b>左键</b>射击 · <b>R</b> 换弹 ·
          <b>Shift</b> 疾走
        </p>
        <p>
          <b>手机：</b>左下摇杆移动 · 右侧滑动转视角 · 右下按钮射击/换弹/疾走
        </p>
        <p>击杀一波波真实士兵，注意爆头可造成致命伤害！</p>
        <div class="btns">
          <button onclick="startGame('easy')">简单</button>
          <button onclick="startGame('normal')">普通</button>
          <button onclick="startGame('hard')">困难</button>
        </div>
        <div id="loadStatus" class="status">
          正在加载敌人模型(Soldier.glb)，请稍候…
        </div>
      </div>
      <div id="gameOver" class="screen">
        <h2>☠ 你阵亡了</h2>
        <p id="goStats"></p>
        <div class="btns">
          <button onclick="location.reload()">重新开始</button>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/environments/RoomEnvironment.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js"></script>
    <script>
      /* ================= 工具 ================= */
      const $ = (id) => document.getElementById(id)
      const clamp = (v, a, b) => Math.max(a, Math.min(b, v))

      /* 音频 */
      let actx = null,
        noiseBuf = null
      function initAudio() {
        if (actx) {
          if (actx.state === 'suspended') actx.resume()
          return
        }
        actx = new (window.AudioContext || window.webkitAudioContext)()
        const len = actx.sampleRate * 0.2
        noiseBuf = actx.createBuffer(1, len, actx.sampleRate)
        const d = noiseBuf.getChannelData(0)
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1
      }
      function playBuf(buf, vol, dur, rate = 1) {
        if (!actx || !buf) return
        const s = actx.createBufferSource()
        s.buffer = buf
        s.playbackRate.value = rate
        const g = actx.createGain()
        g.gain.setValueAtTime(vol, actx.currentTime)
        g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur)
        s.connect(g)
        g.connect(actx.destination)
        s.start()
      }
      function beep(f, d, type = 'sine', vol = 0.15) {
        if (!actx) return
        const o = actx.createOscillator(),
          g = actx.createGain()
        o.type = type
        o.frequency.value = f
        o.connect(g)
        g.connect(actx.destination)
        g.gain.setValueAtTime(vol, actx.currentTime)
        g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + d)
        o.start()
        o.stop(actx.currentTime + d)
      }
      const sShoot = () => playBuf(noiseBuf, 0.18, 0.12, 1.2)
      const sHit = () => beep(1400, 0.05, 'square', 0.12)
      const sHead = () => {
        beep(2000, 0.06, 'square', 0.15)
        setTimeout(() => beep(2600, 0.06, 'square', 0.12), 60)
      }
      const sEnemyShoot = () => beep(220, 0.12, 'square', 0.07)
      const sDeath = () => {
        beep(300, 0.25, 'sawtooth', 0.1)
        setTimeout(() => beep(180, 0.3, 'sawtooth', 0.1), 150)
      }
      const sReload = () => {
        beep(500, 0.06, 'square', 0.08)
        setTimeout(() => beep(700, 0.08, 'square', 0.08), 180)
      }
      let bgmInt = null,
        bgmStep = 0
      const scale = [261.63, 293.66, 329.63, 392, 440, 523.25]
      function startBGM() {
        initAudio()
        if (bgmInt) return
        bgmInt = setInterval(() => {
          if (!actx) return
          const o = actx.createOscillator(),
            g = actx.createGain()
          o.type = 'triangle'
          o.frequency.value = scale[bgmStep % scale.length]
          o.connect(g)
          g.connect(actx.destination)
          g.gain.setValueAtTime(0.015, actx.currentTime)
          g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.45)
          o.start()
          o.stop(actx.currentTime + 0.45)
          if (bgmStep % 4 === 0) {
            const b = actx.createOscillator(),
              bg = actx.createGain()
            b.type = 'sine'
            b.frequency.value = 130.81
            b.connect(bg)
            bg.connect(actx.destination)
            bg.gain.setValueAtTime(0.025, actx.currentTime)
            bg.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.6)
            b.start()
            b.stop(actx.currentTime + 0.6)
          }
          bgmStep++
        }, 450)
      }

      /* ================= 渲染器 / 场景 ================= */
      const scene = new THREE.Scene()
      scene.background = new THREE.Color(0xdfe6e9)
      scene.fog = new THREE.Fog(0xdfe6e9, 20, 52)
      const camera = new THREE.PerspectiveCamera(
        75,
        innerWidth / innerHeight,
        0.05,
        200,
      )
      camera.rotation.order = 'YXZ'
      const renderer = new THREE.WebGLRenderer({ antialias: true })
      renderer.setSize(innerWidth, innerHeight)
      renderer.shadowMap.enabled = true
      renderer.shadowMap.type = THREE.PCFSoftShadowMap
      renderer.outputEncoding = THREE.sRGBEncoding
      renderer.toneMapping = THREE.ACESFilmicToneMapping
      renderer.toneMappingExposure = 1.05
      document.body.insertBefore(renderer.domElement, document.body.firstChild)

      try {
        const pmrem = new THREE.PMREMGenerator(renderer)
        scene.environment = pmrem.fromScene(
          new THREE.RoomEnvironment(),
          0.04,
        ).texture
      } catch (e) {
        console.warn('环境贴图失败', e)
      }

      scene.add(new THREE.AmbientLight(0xffffff, 0.35))
      const dirLight = new THREE.DirectionalLight(0xfff5e6, 0.8)
      dirLight.position.set(10, 20, 12)
      dirLight.castShadow = true
      dirLight.shadow.mapSize.width = dirLight.shadow.mapSize.height = 2048
      const sc = dirLight.shadow.camera
      sc.left = -22
      sc.right = 22
      sc.top = 22
      sc.bottom = -22
      sc.near = 0.5
      sc.far = 60
      scene.add(dirLight)

      /* 程序纹理 */
      function canvasTex(draw, rx, ry) {
        const c = document.createElement('canvas')
        c.width = c.height = 128
        draw(c.getContext('2d'))
        const t = new THREE.CanvasTexture(c)
        t.encoding = THREE.sRGBEncoding
        if (rx) {
          t.wrapS = t.wrapT = THREE.RepeatWrapping
          t.repeat.set(rx, ry)
        }
        return t
      }
      const floorTex = canvasTex(
        (x) => {
          x.fillStyle = '#ecf0f1'
          x.fillRect(0, 0, 128, 128)
          x.strokeStyle = '#bdc3c7'
          x.lineWidth = 3
          for (let i = 0; i <= 128; i += 32) {
            x.beginPath()
            x.moveTo(i, 0)
            x.lineTo(i, 128)
            x.stroke()
            x.beginPath()
            x.moveTo(0, i)
            x.lineTo(128, i)
            x.stroke()
          }
          x.fillStyle = 'rgba(149,165,166,.25)'
          for (let i = 0; i < 200; i++)
            x.fillRect(Math.random() * 128, Math.random() * 128, 2, 2)
        },
        16,
        13,
      )
      const woodTex = canvasTex((x) => {
        x.fillStyle = '#deb887'
        x.fillRect(0, 0, 128, 128)
        x.strokeStyle = '#c19a6b'
        x.lineWidth = 2
        for (let i = 0; i < 12; i++) {
          x.beginPath()
          x.moveTo(0, i * 11 + 2)
          x.bezierCurveTo(40, i * 11, 80, i * 11 + 6, 128, i * 11)
          x.stroke()
        }
      })
      const labelTex = (t, bg, fg) =>
        canvasTex((x) => {
          x.fillStyle = bg
          x.fillRect(0, 0, 128, 128)
          x.fillStyle = fg
          x.font = 'bold 40px sans-serif'
          x.textAlign = 'center'
          x.textBaseline = 'middle'
          x.fillText(t, 64, 66)
        })
      const scaleTex = canvasTex((x) => {
        x.fillStyle = '#2980b9'
        x.fillRect(0, 0, 128, 128)
        x.strokeStyle = '#154360'
        x.lineWidth = 2
        for (let r = 0; r < 8; r++)
          for (let c = 0; c < 8; c++) {
            x.beginPath()
            x.arc(c * 16 + 8, r * 16 + 8, 8, Math.PI, 0)
            x.stroke()
          }
      })
      scaleTex.wrapS = scaleTex.wrapT = THREE.RepeatWrapping
      scaleTex.repeat.set(2, 1)

      /* 子弹孔 & 烟雾纹理 */
      const holeTex = canvasTex((x) => {
        x.clearRect(0, 0, 128, 128)
        const g = x.createRadialGradient(64, 64, 0, 64, 64, 64)
        g.addColorStop(0, 'rgba(10,10,10,0.95)')
        g.addColorStop(0.6, 'rgba(30,30,30,0.8)')
        g.addColorStop(1, 'rgba(50,50,50,0)')
        x.fillStyle = g
        x.beginPath()
        x.arc(64, 64, 50, 0, Math.PI * 2)
        x.fill()
        x.fillStyle = 'rgba(0,0,0,0.9)'
        x.beginPath()
        x.arc(64, 64, 18, 0, Math.PI * 2)
        x.fill()
        for (let i = 0; i < 16; i++) {
          const a = Math.random() * Math.PI * 2,
            r = 20 + Math.random() * 40
          x.fillStyle = 'rgba(0,0,0,0.55)'
          x.beginPath()
          x.arc(
            64 + Math.cos(a) * r,
            64 + Math.sin(a) * r,
            4 + Math.random() * 5,
            0,
            Math.PI * 2,
          )
          x.fill()
        }
      })
      const smokeTex = canvasTex((x) => {
        const g = x.createRadialGradient(64, 64, 0, 64, 64, 64)
        g.addColorStop(0, 'rgba(220,220,220,0.7)')
        g.addColorStop(1, 'rgba(220,220,220,0)')
        x.fillStyle = g
        x.fillRect(0, 0, 128, 128)
      })

      /* 地面/天花板/灯 */
      const floor = new THREE.Mesh(
        new THREE.PlaneGeometry(30, 24),
        new THREE.MeshPhysicalMaterial({
          map: floorTex,
          roughness: 0.35,
          metalness: 0.02,
          clearcoat: 0.35,
          clearcoatRoughness: 0.2,
        }),
      )
      floor.rotation.x = -Math.PI / 2
      floor.receiveShadow = true
      scene.add(floor)
      const saleTex = canvasTex((x) => {
        x.fillStyle = '#e74c3c'
        x.fillRect(0, 0, 128, 128)
        x.fillStyle = '#fff'
        x.font = 'bold 46px sans-serif'
        x.textAlign = 'center'
        x.textBaseline = 'middle'
        x.fillText('SALE', 64, 64)
      })
      const sale = new THREE.Mesh(
        new THREE.PlaneGeometry(3, 3),
        new THREE.MeshBasicMaterial({ map: saleTex }),
      )
      sale.rotation.x = -Math.PI / 2
      sale.position.set(0, 0.012, 5)
      scene.add(sale)

      const ceil = new THREE.Mesh(
        new THREE.PlaneGeometry(30, 24),
        new THREE.MeshStandardMaterial({ color: 0xf5f6fa, roughness: 0.9 }),
      )
      ceil.rotation.x = Math.PI / 2
      ceil.position.y = 3.2
      scene.add(ceil)
      const lightMat = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        emissive: 0xffffff,
        emissiveIntensity: 1,
      })
      const lightColors = [0xfff0dd, 0xffffff, 0xddeeff]
      ;[7, 0, -7].forEach((lz, li) => {
        ;[-8, 0, 8].forEach((lx) => {
          const p = new THREE.Mesh(new THREE.BoxGeometry(4, 0.05, 1), lightMat)
          p.position.set(lx, 3.16, lz)
          scene.add(p)
          const pl = new THREE.PointLight(lightColors[li], 0.26, 14)
          pl.position.set(lx, 2.9, lz)
          scene.add(pl)
        })
      })

      /* 墙体碰撞 */
      const obstacles = []
      function addWall(cx, cz, w, d) {
        const m = new THREE.Mesh(
          new THREE.BoxGeometry(w, 3, d),
          new THREE.MeshStandardMaterial({ color: 0xecf0f1, roughness: 0.95 }),
        )
        m.position.set(cx, 1.5, cz)
        m.receiveShadow = true
        scene.add(m)
        obstacles.push(new THREE.Box3().setFromObject(m))
      }
      addWall(0, -12, 30, 1)
      addWall(-15, 0, 1, 24)
      addWall(15, 0, 1, 24)
      addWall(-9, 12, 12, 1)
      addWall(9, 12, 12, 1)
      const glassMat = new THREE.MeshPhysicalMaterial({
        color: 0xaed6f1,
        transparent: true,
        opacity: 0.25,
        roughness: 0.05,
        metalness: 0.5,
        clearcoat: 1,
      })
      ;[-1.6, 1.6].forEach((x) => {
        const d = new THREE.Mesh(
          new THREE.BoxGeometry(2.8, 2.4, 0.08),
          glassMat,
        )
        d.position.set(x, 1.2, 11.6)
        scene.add(d)
      })

      /* 绿植 & 购物篮 */
      function createPlant(x, z) {
        const g = new THREE.Group()
        const pot = new THREE.Mesh(
          new THREE.CylinderGeometry(0.28, 0.22, 0.4, 12),
          new THREE.MeshStandardMaterial({ color: 0x8d6e63 }),
        )
        pot.position.y = 0.2
        g.add(pot)
        const leaf = new THREE.Mesh(
          new THREE.IcosahedronGeometry(0.42, 1),
          new THREE.MeshStandardMaterial({
            color: 0x27ae60,
            flatShading: true,
            roughness: 0.9,
          }),
        )
        leaf.position.y = 0.75
        g.add(leaf)
        g.position.set(x, 0, z)
        scene.add(g)
        obstacles.push(new THREE.Box3().setFromObject(g))
      }
      createPlant(-13.5, 9.5)
      createPlant(13.5, 9.5)
      function createBasketStack(x, z) {
        for (let i = 0; i < 3; i++) {
          const b = new THREE.Mesh(
            new THREE.BoxGeometry(0.5, 0.3, 0.36),
            new THREE.MeshStandardMaterial({ color: 0xe74c3c, roughness: 0.7 }),
          )
          b.position.set(x, 0.15 + i * 0.31, z)
          scene.add(b)
        }
      }
      createBasketStack(-3, 10)
      createBasketStack(3, 10)

      /* 货架 + 装饰商品 */
      const shelfRects = []
      const shelfRows = [4, 0, -4]
      function createShelf(z) {
        const g = new THREE.Group()
        const metal = new THREE.MeshStandardMaterial({
          color: 0x95a5a6,
          metalness: 0.8,
          roughness: 0.3,
        })
        const wood = new THREE.MeshStandardMaterial({
          map: woodTex,
          roughness: 0.7,
        })
        const L = 18,
          D = 1.2,
          H = 2.0
        const base = new THREE.Mesh(new THREE.BoxGeometry(L, 0.08, D), metal)
        base.position.y = 0.04
        g.add(base)
        ;[
          [-1, -1],
          [1, -1],
          [-1, 1],
          [1, 1],
        ].forEach(([sx, sz]) => {
          const up = new THREE.Mesh(new THREE.BoxGeometry(0.1, H, 0.1), metal)

      function createTracer(from, to) {
        const dir = new THREE.Vector3().subVectors(to, from)
        const len = dir.length()
        if (len < 0.01) return
        const geo = new THREE.CylinderGeometry(0.012, 0.012, len, 6, 1, true)
        geo.translate(0, -len / 2, 0)
        const mat = new THREE.MeshBasicMaterial({
          color: 0xffff88,
          transparent: true,
          opacity: 0.9,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
        })
        const mesh = new THREE.Mesh(geo, mat)
        mesh.position.copy(from)
        mesh.quaternion.setFromUnitVectors(
          new THREE.Vector3(0, 1, 0),
          dir.clone().normalize(),
        )
        scene.add(mesh)
        tracers.push({ mesh, life: 0.12 })

      function createBulletHole(h) {
        if (!h.face) return
        const nMat = new THREE.Matrix3().getNormalMatrix(h.object.matrixWorld)
        const wNormal = h.face.normal.clone().applyMatrix3(nMat).normalize()
        const geo = new THREE.PlaneGeometry(0.12, 0.12)
        const mat = new THREE.MeshBasicMaterial({
          map: holeTex,
          transparent: true,
          depthWrite: false,
          polygonOffset: true,
          polygonOffsetFactor: -4,
        })
        const decal = new THREE.Mesh(geo, mat)
        decal.position.copy(h.point).addScaledVector(wNormal, 0.003)
        decal.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), wNormal)
        scene.add(decal)
        decals.push(decal)
        if (decals.length > 60) {
          const old = decals.shift()
          scene.remove(old)
          old.geometry.dispose()
          old.material.dispose()

      /* 射击 */
      function shoot() {
        if (reloading || !playing) return
        const now = performance.now()
        if (now - lastShot < fireRate) return
        if (mag <= 0) {
          reload()
          return
        }
        lastShot = now
        mag--
        updateHUD()
        gunRecoil = 1
        crossExpand = 1
        sShoot()
        muzzleFlash.visible = true
        muzzleFlash.material.opacity = 0.95
        muzzleLight.intensity = 2.5
        setTimeout(() => {
          muzzleFlash.visible = false
          muzzleLight.intensity = 0
        }, 55)

        const from = new THREE.Vector3()
        muzzleObj.getWorldPosition(from)
        raycaster.setFromCamera(new THREE.Vector2(0, 0), camera)
        const hits = raycaster.intersectObjects(scene.children, true)
        let to = from
          .clone()
          .add(raycaster.ray.direction.clone().multiplyScalar(60))
        let enemyHit = null
        for (const h of hits) {
          let root = h.object
          while (root && !root.userData.enemy) root = root.parent
          if (root && root.userData.enemy && !root.userData.dead) {
            enemyHit = { root, h }
            to = h.point.clone()
            break
          } else if (h.face) {
            to = h.point.clone()
            spawnSpark(h.point, 0xdddddd)
            createBulletHole(h)
            createSmoke(h.point)
            break
          }
        }
        createTracer(from, to)
        createSmoke(from, 0.15)
        if (enemyHit) {
          const root = enemyHit.root,
            h = enemyHit.h
          const isHead = h.point.y > root.position.y + 1.45
          root.userData.hp -= isHead ? 75 : 25
          createBlood(h.point)
          isHead ? sHead() : sHit()
          showHitMarker()
          if (root.userData.hp <= 0) killEnemy(root)
        }
      }
      function reload() {
        if (reloading || mag === maxMag) return
        reloading = true
        sReload()
        setTimeout(() => {
          const need = maxMag - mag
          const load = Math.min(need, reserve)
          mag += load
          reserve -= load
          reloading = false
          updateHUD()
        }, 1400)
      }

      /* 流程 */
      function startGame(diff) {
        if (!modelReady) {
          alert('敌人模型(Soldier)还在加载中，请稍候几秒再开始！')
          return
        }
        initAudio()
        startBGM()
        $('menu').style.display = 'none'
        $('overlay').style.display = 'none'
        health = 100
        mag = 30
        reserve = 120
        kills = 0
        wave = 1
        aliveCount = 0
        spawnQueue = 0
        betweenWaves = false
        currentDiff = diff || 'normal'
        camera.position.set(0, 1.6, 9)
        camera.rotation.set(0, 0, 0)
        updateHUD()
        playing = true
        startWave()
        if (!usingTouch) renderer.domElement.requestPointerLock()
      }
      function startWave() {
        spawnQueue = 2 + wave
        spawnTimer = 0
      }
      function gameOver() {
        playing = false
        document.exitPointerLock()
        $('overlay').style.display = 'flex'
        $('gameOver').style.display = 'flex'
        $('goStats').textContent = `波次：${wave}　击杀：${kills}`
      }

      /* 控制 */
      let yaw = 0,
        pitch = 0
      const keys = {}
      let usingTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0
      if (usingTouch) $('touchUI').style.display = 'block'
      let touchRun = false,
        joyVec = { x: 0, y: 0 }
      document.addEventListener('mousemove', (e) => {
        if (document.pointerLockElement !== renderer.domElement) return
        yaw -= e.movementX * 0.0022
        pitch -= e.movementY * 0.0022
        pitch = clamp(pitch, -1.5, 1.5)
        camera.rotation.y = yaw
        camera.rotation.x = pitch
      })
      document.addEventListener('mousedown', (e) => {
        if (e.button === 0) isFiring = true
      })
      document.addEventListener('mouseup', (e) => {
        if (e.button === 0) isFiring = false
      })
      document.addEventListener('keydown', (e) => {
        keys[e.code] = true
        if (e.code === 'KeyR') reload()
      })
      document.addEventListener('keyup', (e) => {
        keys[e.code] = false
      })
      renderer.domElement.addEventListener('click', () => {
        if (
          playing &&
          !usingTouch &&
          document.pointerLockElement !== renderer.domElement
        )
          renderer.domElement.requestPointerLock()
      })

      /* 触控 */
      ;(function () {
        const jb = $('joyBase'),
          js = $('joyStick')
        let jid = null
        const upd = (t) => {
          const r = jb.getBoundingClientRect()
          let dx = t.clientX - (r.left + r.width / 2),
            dy = t.clientY - (r.top + r.height / 2)
          const max = r.width / 2 - 10,
            d = Math.hypot(dx, dy)
          if (d > max) {
            dx = (dx / d) * max
            dy = (dy / d) * max
          }
          js.style.transform = `translate(${dx}px,${dy}px)`
          joyVec = { x: dx / max, y: dy / max }
        }
        jb.addEventListener(
          'touchstart',
          (e) => {
            e.preventDefault()
            const t = e.changedTouches[0]
            jid = t.identifier
            upd(t)
          },
          { passive: false },
        )
        jb.addEventListener(
          'touchmove',
          (e) => {
            e.preventDefault()
            const t = [...e.changedTouches].find((t) => t.identifier === jid)
            if (t) upd(t)
          },
          { passive: false },
        )
        const end = (e) => {
          if ([...e.changedTouches].some((t) => t.identifier === jid)) {
            jid = null
            joyVec = { x: 0, y: 0 }
            js.style.transform = 'translate(0,0)'
          }
        }
        jb.addEventListener('touchend', end)
        jb.addEventListener('touchcancel', end)
        let lid = null,
          last = { x: 0, y: 0 }
        document.addEventListener(
          'touchstart',
          (e) => {
            if (e.target.closest('#touchUI')) return
            const t = e.changedTouches[0]
            lid = t.identifier
            last = { x: t.clientX, y: t.clientY }
          },
          { passive: false },
        )
        document.addEventListener(
          'touchmove',
          (e) => {
            if (lid === null) return
            const t = [...e.changedTouches].find((t) => t.identifier === lid)
            if (!t) return
            const dx = t.clientX - last.x,
              dy = t.clientY - last.y
            last = { x: t.clientX, y: t.clientY }
            yaw -= dx * 0.005
            pitch = clamp(pitch - dy * 0.005, -1.5, 1.5)
            camera.rotation.y = yaw
            camera.rotation.x = pitch
          },
          { passive: false },
        )
        const lend = (e) => {
          if ([...e.changedTouches].some((t) => t.identifier === lid))
            lid = null
        }
        document.addEventListener('touchend', lend)
        document.addEventListener('touchcancel', lend)
        $('btnFire').addEventListener(
          'touchstart',
          (e) => {
            e.preventDefault()
            isFiring = true
          },
          { passive: false },
        )
        $('btnFire').addEventListener(
          'touchend',
          (e) => {
            e.preventDefault()
            isFiring = false
          },
          { passive: false },
        )
        $('btnReload').addEventListener(
          'touchstart',
          (e) => {
            e.preventDefault()
            reload()
          },
          { passive: false },
        )
        $('btnRun').addEventListener(
          'touchstart',
          (e) => {
            e.preventDefault()
            touchRun = true
          },
          { passive: false },
        )
        $('btnRun').addEventListener(
          'touchend',
          (e) => {
            e.preventDefault()
            touchRun = false
          },
          { passive: false },
        )
      })()

      /* 碰撞 */
      const pbox = new THREE.Box3()
      function collides(pos) {
        pbox.min.set(pos.x - 0.35, 0.1, pos.z - 0.35)
        pbox.max.set(pos.x + 0.35, 1.8, pos.z + 0.35)
        for (const o of obstacles) if (pbox.intersectsBox(o)) return true
        return false
      }

      /* 小地图 */
      const map = $('map'),
        mctx = map.getContext('2d')
      function drawMap() {
        const W = map.width,
          H = map.height
        mctx.clearRect(0, 0, W, H)
        mctx.fillStyle = '#2d3436'
        mctx.fillRect(0, 0, W, H)
        mctx.strokeStyle = '#636e72'
        mctx.lineWidth = 2
        mctx.strokeRect(1, 1, W - 2, H - 2)
        mctx.fillStyle = '#7f8c8d'
        shelfRects.forEach((r) =>
          mctx.fillRect(
            ((r.x + 15) / 30) * W,
            ((r.z - 0.6 + 12) / 24) * H,
            (18 / 30) * W,
            (1.2 / 24) * H,
          ),
        )
        mctx.fillStyle = '#27ae60'
        checkoutRects.forEach((r) =>
          mctx.fillRect(
            ((r.x - 1.25 + 15) / 30) * W,
            ((r.z - 0.6 + 12) / 24) * H,
            (2.5 / 30) * W,
            (1.2 / 24) * H,
          ),
        )
        const px = ((camera.position.x + 15) / 30) * W,
          py = ((camera.position.z + 12) / 24) * H
        mctx.fillStyle = '#e74c3c'
        mctx.beginPath()
        mctx.arc(px, py, 3.5, 0, Math.PI * 2)
        mctx.fill()
        const fx = -Math.sin(camera.rotation.y),
          fz = -Math.cos(camera.rotation.y)
        mctx.strokeStyle = '#e74c3c'
        mctx.beginPath()
        mctx.moveTo(px, py)
        mctx.lineTo(px + fx * 10, py + fz * 10)
        mctx.stroke()
        mctx.fillStyle = '#f1c40f'
        enemies.forEach((e) => {
          if (e.userData.dead) return
          const nx = ((e.position.x + 15) / 30) * W,
            ny = ((e.position.z + 12) / 24) * H
          mctx.beginPath()
          mctx.arc(nx, ny, 3, 0, Math.PI * 2)
          mctx.fill()
        })
      }

      /* 主循环 */
      const clock = new THREE.Clock()
      let stepTimer = 0
      function animate() {
        requestAnimationFrame(animate)
        const dt = Math.min(clock.getDelta(), 0.1)
        const locked = document.pointerLockElement === renderer.domElement
        const active = playing && (locked || usingTouch)

        if (playing && !locked && !usingTouch) {
          $('prompt').style.display = 'block'
          $('prompt').textContent = '点击画面继续'
        } else $('prompt').style.display = 'none'

        if (active) {
          const speed =
            keys['ShiftLeft'] || keys['ShiftRight'] || touchRun ? 5.0 : 3.0
          const fwd = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw))
          const rgt = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw))
          const mv = new THREE.Vector3()
          if (keys['KeyW']) mv.add(fwd)
          if (keys['KeyS']) mv.sub(fwd)
          if (keys['KeyD']) mv.add(rgt)
          if (keys['KeyA']) mv.sub(rgt)
          if (usingTouch && (joyVec.x || joyVec.y)) {
            mv.addScaledVector(fwd, -joyVec.y)
            mv.addScaledVector(rgt, joyVec.x)
          }
          if (mv.lengthSq() > 0) {
            mv.normalize().multiplyScalar(speed * dt)
            const ox = camera.position.x,
              oz = camera.position.z
            camera.position.x += mv.x
            if (collides(camera.position)) camera.position.x = ox
            camera.position.z += mv.z
            if (collides(camera.position)) camera.position.z = oz
            camera.position.x = clamp(camera.position.x, -14.2, 14.2)
            camera.position.z = clamp(camera.position.z, -11.2, 11.2)
            stepTimer += dt
            if (stepTimer > 0.45) {
              beep(110, 0.03, 'sine', 0.02)
              stepTimer = 0
            }
          }
          if (isFiring && !reloading) shoot()
          if (spawnQueue > 0) {
            spawnTimer -= dt
            if (spawnTimer <= 0) {
              spawnEnemy(currentDiff)
              spawnQueue--
              spawnTimer = 1.2
            }
          } else if (aliveCount === 0 && !betweenWaves) {
            betweenWaves = true
            waveTimer = 3
          }
          if (betweenWaves) {
            waveTimer -= dt
            if (waveTimer <= 0) {
              wave++
              startWave()
              betweenWaves = false
              updateHUD()
            }
          }
        }

        if (gunRecoil > 0) gunRecoil = Math.max(0, gunRecoil - dt * 4)
        gun.position.z = baseGunPos.z + gunRecoil * 0.12
        gun.rotation.x = -gunRecoil * 0.25
        crossExpand = Math.max(0, crossExpand - dt * 4)
        $('crosshair').style.transform = `scale(${1 + crossExpand * 0.8})`

        for (let i = tracers.length - 1; i >= 0; i--) {
          const t = tracers[i]
          t.life -= dt
          t.mesh.material.opacity = Math.max(0, t.life / 0.12) * 0.9
          if (t.life <= 0) {
            scene.remove(t.mesh)
            t.mesh.geometry.dispose()
            tracers.splice(i, 1)
          }
        }
        for (let i = smokes.length - 1; i >= 0; i--) {
          const s = smokes[i]
          s.life -= dt
          const k = s.life / s.max
          s.spr.material.opacity = k * 0.5
          s.spr.scale.setScalar(s.sb + (1 - k) * 0.35)
          if (s.life <= 0) {
            scene.remove(s.spr)
            smokes.splice(i, 1)
          }
        }
        for (let i = bloods.length - 1; i >= 0; i--) {
          const b = bloods[i]
          b.life -= dt
          b.m.position.add(b.v)
          b.v.y -= 0.003
          if (b.life <= 0) {
            scene.remove(b.m)
            b.m.geometry.dispose()
            b.m.material.dispose()
            bloods.splice(i, 1)
          }
        }

        for (let i = enemies.length - 1; i >= 0; i--) {
          const e = enemies[i],
            ud = e.userData
          if (ud.dying) {
            ud.deathTimer -= dt
            e.scale.setScalar(Math.max(0.01, ud.deathTimer / 0.4))
            if (ud.deathTimer <= 0) {
              scene.remove(e)
              enemies.splice(i, 1)
            }
            continue
          }
          if (ud.dead) continue
          const dir = new THREE.Vector3().subVectors(
            camera.position,
            e.position,
          )
          dir.y = 0
          const dist = dir.length()
          const moving = dist > 4
          if (moving) {
            dir.normalize()
            e.position.addScaledVector(dir, ud.speed * dt)
          }
          e.rotation.y = Math.atan2(dir.x, dir.z)
          ud.actions.walk.setEffectiveWeight(moving ? 1 : 0)
          ud.actions.idle.setEffectiveWeight(moving ? 0 : 1)
          ud.mixer.update(dt)
          ud.lastShot -= dt
          if (dist < 18 && ud.lastShot <= 0) {
            ud.lastShot = ud.fireCooldown + Math.random() * 0.6
            enemyShoot(e)
          }
        }

        if (playing) drawMap()
        renderer.render(scene, camera)
      }

      /* 初始显示菜单 */
      $('menu').style.display = 'flex'
      animate()
      window.addEventListener('resize', () => {
        camera.aspect = innerWidth / innerHeight
        camera.updateProjectionMatrix()
        renderer.setSize(innerWidth, innerHeight)
      })
    </script>
  </body>
</html>
